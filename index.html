<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ড্যাশবোর্ড - কোপা সামসু লটারি</title>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.9);
      --gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      --accent-green: #00e676;
      --accent-red: #ff4d4d;
      --text-muted: #a0aec0;
      --border-color: rgba(255, 215, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-color); min-height: 100vh; color: #fff; display: flex; flex-direction: column; align-items: center; padding: 14px 14px 40px 14px; overflow-x: hidden; }

    .main-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; }

    .user-header-card {
      background: var(--card-bg); backdrop-filter: blur(15px); border: 1px solid var(--border-color);
      border-radius: 20px; padding: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; gap: 12px;
    }
    .header-top { display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
    .avatar-img { width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--gold); object-fit: cover; box-shadow: 0 0 12px rgba(255, 215, 0, 0.3); transition: transform 0.2s; }
    .header-left:hover .avatar-img { transform: scale(1.05); }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-size: 17px; font-weight: 800; color: #fff; line-height: 1.2; transition: color 0.2s; margin-bottom: 4px; }
    .header-left:hover .user-name { color: var(--gold); }
    
    .user-contact { font-size: 12px; color: var(--text-muted); font-weight: 500; display: flex; align-items: center; gap: 6px; margin-bottom: 2px; }
    .user-contact i { color: var(--gold); width: 12px; text-align: center; }

    .balance-card {
      background: linear-gradient(135deg, rgba(25, 30, 50, 0.95), rgba(12, 15, 26, 0.95)); border: 1px solid var(--gold); border-radius: 20px; padding: 20px; text-align: center; position: relative; box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }
    .balance-title { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .balance-amount { font-size: 34px; font-weight: 900; color: var(--gold); margin: 4px 0 16px 0; text-shadow: 0 0 15px rgba(255, 215, 0, 0.3); }
    .balance-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .btn-action { padding: 12px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-deposit { background: var(--gold-gradient); color: #000; }
    .btn-withdraw { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }

    .hero-buy-card {
      background: linear-gradient(135deg, rgba(0, 230, 118, 0.25), rgba(18, 22, 36, 0.95)); border: 1px solid var(--accent-green); border-radius: 18px; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #fff; box-shadow: 0 4px 20px rgba(0, 230, 118, 0.15);
    }
    .hero-left { display: flex; align-items: center; gap: 14px; }
    .hero-icon { width: 48px; height: 48px; background: rgba(0, 230, 118, 0.2); border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--accent-green); }

    .live-draw-card {
      background: linear-gradient(135deg, rgba(255, 77, 77, 0.15), rgba(18, 22, 36, 0.95)); border: 1px solid rgba(255, 77, 77, 0.4); border-radius: 18px; padding: 16px; display: flex; align-items: center; justify-content: space-between;
    }
    .timer-display { font-size: 15px; font-weight: 800; font-family: monospace; }

    .ticket-status-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 14px 16px; }
    .ticket-header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
    .status-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; }
    .status-won { background: rgba(0, 230, 118, 0.2); color: var(--accent-green); }
    .status-lost { background: rgba(255, 77, 77, 0.2); color: #ff4d4d; }
    .status-pending { background: rgba(255, 215, 0, 0.2); color: var(--gold); }

    .menu-list { display: flex; flex-direction: column; gap: 10px; }
    .menu-item-row {
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #fff; font-size: 14px; font-weight: 600; transition: 0.2s;
    }
    .menu-item-row:hover { border-color: rgba(255, 215, 0, 0.3); background: rgba(255, 255, 255, 0.03); }
    .menu-item-row i.menu-icon { color: var(--gold); width: 22px; text-align: center; }

    .btn-logout-bottom {
      width: 100%; padding: 14px; background: linear-gradient(135deg, #ff4d4d 0%, #d32f2f 100%); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(255, 77, 77, 0.3); transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-logout-bottom:active { transform: scale(0.98); }

    .popup-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 9999; opacity: 0; visibility: hidden; transition: all 0.3s; padding: 20px;
    }
    .popup-overlay.active { opacity: 1; visibility: visible; }
    .popup-content { background: #121624; border: 1px solid var(--gold); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8); }
    .popup-img { width: 100%; max-height: 180px; object-fit: cover; border-radius: 12px; margin-bottom: 12px; display: none; }
    .popup-title { font-size: 18px; font-weight: 800; color: var(--gold); margin-bottom: 8px; }
    .popup-msg { font-size: 13px; color: #e2e8f0; margin-bottom: 16px; line-height: 1.4; }
    .popup-btn { background: var(--gold-gradient); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-block; width: 100%; }
    .popup-close { position: absolute; top: 10px; right: 14px; color: var(--text-muted); font-size: 20px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- হেডার: প্রোফাইল এবং কন্টাক্ট ইনফো -->
    <div class="user-header-card">
      <div class="header-top">
        <a href="profile.html" class="header-left" title="প্রোফাইল পরিবর্তন করুন">
          <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile" class="avatar-img" id="userAvatarImg">
          <div class="user-info">
            <div class="user-name" id="userName">ব্যবহারকারীর নাম</div>
            <div class="user-contact" id="userPhone"><i class="fa-solid fa-phone"></i> লোড হচ্ছে...</div>
            <div class="user-contact" id="userEmail"><i class="fa-solid fa-envelope"></i> লোড হচ্ছে...</div>
          </div>
        </a>
      </div>
    </div>

    <!-- ব্যালেন্স কার্ড -->
    <div class="balance-card">
      <div class="balance-title">মোট ব্যালেন্স</div>
      <div class="balance-amount">৳ <span id="userBalance">0.00</span></div>
      
      <div class="balance-actions">
        <a href="deposit.html" class="btn-action btn-deposit">
          <i class="fa-solid fa-plus-circle"></i> ডিপোজিট
        </a>
        <a href="withdraw.html" class="btn-action btn-withdraw">
          <i class="fa-solid fa-arrow-up-from-bracket"></i> টাকা তুলুন
        </a>
      </div>
    </div>

    <!-- টিকিট ক্রয় কার্ড -->
    <a href="buy-ticket.html" class="hero-buy-card">
      <div class="hero-left">
        <div class="hero-icon"><i class="fa-solid fa-ticket"></i></div>
        <div>
          <h3 style="font-size:16px; font-weight:800;">টিকিট কিনুন</h3>
          <p style="font-size:12px; color:rgba(255,255,255,0.7);">আজকের ড্র-তে অংশ নিন</p>
        </div>
      </div>
      <i class="fa-solid fa-chevron-right" style="color: var(--accent-green);"></i>
    </a>

    <!-- বর্তমান লাইভ স্লট এবং ড্র কাউন্টডাউন কার্ড -->
    <div class="live-draw-card">
      <div style="display:flex; align-items:center; gap:12px;">
        <span style="background:#ff4d4d; color:#fff; font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px;" id="liveBadgeStatus">LIVE</span>
        <div>
          <div style="font-size:11px; color:#ffb3b3;" id="activeSlotTitleInfo">স্লট ড্র কাউন্টডাউন:</div>
          <div class="timer-display" id="drawTimer">লোড হচ্ছে...</div>
        </div>
      </div>
      <a href="live.html" style="background:#ff4d4d; color:#fff; padding:8px 14px; border-radius:10px; text-decoration:none; font-size:12px; font-weight:700;">লাইভ রেজাল্ট</a>
    </div>

    <!-- টিকিট স্ট্যাটাস কার্ড -->
    <div class="ticket-status-card">
      <div class="ticket-header">
        <div>
          <span style="font-size:12px; color:var(--text-muted); display:block; margin-bottom:2px;" id="nextDrawSlotLabel">স্লট টিকিটসমূহ:</span>
          <strong id="nextDrawTicketId" style="color:var(--gold); font-size:15px;">লোড হচ্ছে...</strong>
        </div>
        <span class="status-badge status-pending" id="nextDrawStatus">-</span>
      </div>
    </div>

    <!-- মেন্যু লিস্ট -->
    <div class="menu-list">
      <a href="my-tickets.html" class="menu-item-row">
        <div><i class="fa-solid fa-ticket menu-icon"></i> আমার সব টিকিট</div>
        <i class="fa-solid fa-angle-right"></i>
      </a>
      <a href="leaderboard.html" class="menu-item-row">
        <div><i class="fa-solid fa-trophy menu-icon"></i> লিডারবোর্ড</div>
        <i class="fa-solid fa-angle-right"></i>
      </a>
      <a href="refer.html" class="menu-item-row">
        <div><i class="fa-solid fa-users menu-icon"></i> রেফার করুন</div>
        <i class="fa-solid fa-angle-right"></i>
      </a>
      <a href="help.html" class="menu-item-row">
        <div><i class="fa-solid fa-headset menu-icon"></i> হেল্প সেন্টার</div>
        <i class="fa-solid fa-angle-right"></i>
      </a>
    </div>

    <!-- লগআউট বাটন -->
    <button class="btn-logout-bottom" id="logoutBtn">
      <i class="fa-solid fa-power-off"></i> লগআউট
    </button>

  </div>

  <!-- পপআপ ওভারলে -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-content">
      <span class="popup-close" id="popupClose">&times;</span>
      <img src="" alt="Notice" class="popup-img" id="popupImg">
      <div class="popup-title" id="popupTitle">ঘোষণা</div>
      <div class="popup-msg" id="popupMsg">বার্তা...</div>
      <a href="#" class="popup-btn" id="popupBtn">ঠিক আছে</a>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      onSnapshot,
      collection,
      query,
      where,
      orderBy,
      limit
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let countdownInterval = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {

        onSnapshot(doc(db, "users", user.uid), (docSnap) => {
          if (docSnap.exists()) {
            const data = docSnap.data();

            if (data.isBanned === true) {
              signOut(auth).then(() => {
                Swal.fire({
                  title: 'একাউন্ট ব্যান করা হয়েছে!',
                  text: 'আপনার একাউন্টটি সাময়িকভাবে বা স্থায়ীভাবে স্থগিত করা হয়েছে।',
                  icon: 'error',
                  confirmButtonText: 'ঠিক আছে',
                  background: '#121624',
                  color: '#fff',
                  allowOutsideClick: false
                }).then(() => {
                  window.location.href = "login.html";
                });
              });
              return;
            }

            document.getElementById('userName').innerText = data.name || user.displayName || 'ইউজার';
            document.getElementById('userEmail').innerText = user.email || data.email || 'ইমেইল পাওয়া যায়নি';
            document.getElementById('userPhone').innerText = data.phone || user.phoneNumber || 'নাম্বার পাওয়া যায়নি';
            
            if (data.profilePic) {
              document.getElementById('userAvatarImg').src = data.profilePic;
            }

            document.getElementById('userBalance').innerText = Number(data.balance || 0).toLocaleString('bn-BD', { minimumFractionDigits: 2 });
          } else {
            signOut(auth).then(() => {
              window.location.href = "login.html";
            });
          }
        });

        const qTickets = query(collection(db, "tickets"), where("userId", "==", user.uid));
        onSnapshot(qTickets, (snapshot) => {
          const nextTicketEl = document.getElementById('nextDrawTicketId');
          const statusEl = document.getElementById('nextDrawStatus');

          const pendingTickets = [];
          snapshot.forEach(docSnap => {
            const data = docSnap.data();
            if (data.status === 'pending' || data.status === 'active' || !data.status) {
              pendingTickets.push(data.ticketNumber || data.ticketId || docSnap.id.substring(0, 6));
            }
          });

          if (pendingTickets.length > 0) {
            let ticketList = pendingTickets.map(id => `#${id}`).join(', ');
            nextTicketEl.innerText = ticketList;
            statusEl.innerText = 'অপেক্ষমাণ';
            statusEl.className = 'status-badge status-pending';
          } else {
            nextTicketEl.innerText = 'কোনো টিকিট নেই';
            statusEl.innerText = 'নাই';
            statusEl.className = 'status-badge status-lost';
          }
        });

        onSnapshot(collection(db, "slots"), (snapshot) => {
          let activeSlot = null;
          snapshot.forEach(docSnap => {
            const slotData = docSnap.data();
            if (slotData.status === "countdown" || slotData.status === "active") {
              activeSlot = { id: docSnap.id, ...slotData };
            }
          });

          const activeSlotTitleInfo = document.getElementById('activeSlotTitleInfo');
          const timerDisplayEl = document.getElementById('drawTimer');
          const nextDrawSlotLabel = document.getElementById('nextDrawSlotLabel');

          if (activeSlot) {
            const shortCode = activeSlot.id.substring(0, 4).toUpperCase();
            nextDrawSlotLabel.innerHTML = `স্লট ID: <span style="color:var(--gold);">#${shortCode}</span> এর টিকিট:`;

            if (activeSlot.status === "active") {
              activeSlotTitleInfo.innerText = `স্লট #${shortCode} ড্র চলছে:`;
              timerDisplayEl.innerText = "LIVE NOW!";
              timerDisplayEl.style.color = "#00e676";
            } else if (activeSlot.drawTime) {
              activeSlotTitleInfo.innerText = `স্লট #${shortCode} ড্র কাউন্টডাউন:`;
              let targetTime = typeof activeSlot.drawTime === 'number' ? activeSlot.drawTime : (activeSlot.drawTime.toDate ? activeSlot.drawTime.toDate().getTime() : new Date(activeSlot.drawTime).getTime());
              startRealtimeCountdown(targetTime);
            }
          } else {
            activeSlotTitleInfo.innerText = `পরবর্তী ড্র শুরু:`;
            nextDrawSlotLabel.innerText = `পরবর্তী ড্র টিকিট:`;
            timerDisplayEl.innerText = "নির্ধারিত হয়নি";
            timerDisplayEl.style.color = "#fff";
            if (countdownInterval) clearInterval(countdownInterval);
          }
        });

        const qPopup = query(collection(db, "popups"), orderBy("createdAt", "desc"), limit(1));
        onSnapshot(qPopup, (snapshot) => {
          if (!snapshot.empty) {
            const popupDoc = snapshot.docs[0];
            const popup = popupDoc.data();
            const lastSeenPopupId = localStorage.getItem('last_seen_popup');
            if (lastSeenPopupId !== popupDoc.id) {
              const overlay = document.getElementById('popupOverlay');
              document.getElementById('popupTitle').innerText = popup.title || 'ঘোষণা';
              document.getElementById('popupMsg').innerText = popup.message || popup.body || '';
              const img = document.getElementById('popupImg');
              if (popup.imageUrl || popup.image) {
                img.src = popup.imageUrl || popup.image;
                img.style.display = 'block';
              } else {
                img.style.display = 'none';
              }
              overlay.classList.add('active');
              document.getElementById('popupClose').onclick = () => {
                overlay.classList.remove('active');
                localStorage.setItem('last_seen_popup', popupDoc.id);
              };
              document.getElementById('popupBtn').onclick = () => {
                overlay.classList.remove('active');
                localStorage.setItem('last_seen_popup', popupDoc.id);
              };
            }
          }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
          Swal.fire({
            title: 'লগআউট করতে চান?',
            text: "আপনাকে পুনরায় লগইন করতে হবে।",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#ff4d4d',
            cancelButtonColor: '#3085d6',
            confirmButtonText: 'হ্যাঁ, লগআউট',
            cancelButtonText: 'বাতিল',
            background: '#121624',
            color: '#fff'
          }).then((result) => {
            if (result.isConfirmed) {
              signOut(auth).then(() => {
                window.location.href = "login.html";
              });
            }
          });
        });

      } else {
        window.location.href = "login.html"; 
      }
    });

    function startRealtimeCountdown(targetTime) {
      if (countdownInterval) clearInterval(countdownInterval);
      function updateTimer() {
        const now = new Date().getTime();
        const difference = targetTime - now;
        if (difference <= 0) {
          clearInterval(countdownInterval);
          const el = document.getElementById('drawTimer');
          el.innerText = "LIVE NOW!";
          el.style.color = "#00e676";
          return;
        }
        const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((difference % (1000 * 60)) / 1000);
        const pad = (num) => num < 10 ? '0' + num : num;
        document.getElementById('drawTimer').innerText = `${pad(hours)} : ${pad(minutes)} : ${pad(seconds)}`;
        document.getElementById('drawTimer').style.color = "#fff";
      }
      updateTimer();
      countdownInterval = setInterval(updateTimer, 1000);
    }
  </script>
</body>
</html>
