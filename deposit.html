<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>ডিপোজিট | কোপা সামসু</title>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.92);

      --gold: #ffd700;
      --gold-dark: #ff8c00;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);

      --green: #00e676;
      --red: #ff5252;
      --orange: #ff9800;

      --text: #ffffff;
      --muted: #a0aec0;

      --border: rgba(255, 215, 0, 0.24);
      --white-border: rgba(255,255,255,0.08);

      --shadow: 0 5px 22px rgba(0,0,0,0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background:
        radial-gradient(circle at top right, rgba(255,215,0,0.055), transparent 30%),
        var(--bg-color);
      color: var(--text);
      min-height: 100vh;
      padding: 14px 14px 40px;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* =========================
       HEADER
    ========================= */

    .page-header {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      box-shadow: var(--shadow);
    }

    .back-btn {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #fff;
      text-decoration: none;

      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;

      font-size: 17px;
      flex-shrink: 0;
    }

    .back-btn:active {
      transform: scale(0.95);
    }

    .page-title {
      flex: 1;
      text-align: center;

      color: var(--gold);
      font-size: 17px;
      font-weight: 800;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 7px;
    }

    .history-btn {
      border: none;
      background: transparent;
      color: #fff;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 1px;
      cursor: pointer;
      min-width: 42px;
    }

    .history-btn i {
      font-size: 16px;
    }

    .history-btn span {
      font-size: 9px;
      color: var(--gold);
      font-weight: 700;
      white-space: nowrap;
    }

    /* =========================
       STEP
    ========================= */

    .step {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .step.active {
      display: flex;
    }

    /* =========================
       CARD
    ========================= */

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;

      box-shadow: var(--shadow);
    }

    .section-title {
      color: var(--gold);
      font-size: 15px;
      font-weight: 800;

      display: flex;
      align-items: center;
      gap: 7px;

      margin-bottom: 13px;
    }

    /* =========================
       PAYMENT METHODS
    ========================= */

    .method-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .method-card {
      min-height: 94px;

      background: rgba(0,0,0,0.28);
      border: 2px solid rgba(255,255,255,0.08);
      border-radius: 13px;

      padding: 12px 8px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 8px;
      cursor: pointer;

      transition: 0.2s ease;
    }

    .method-card:active {
      transform: scale(0.97);
    }

    .method-card.bkash.selected {
      border-color: #e2136e;
      background: rgba(226,19,110,0.10);
      box-shadow: 0 0 15px rgba(226,19,110,0.10);
    }

    .method-card.nagad.selected {
      border-color: #ec1c24;
      background: rgba(236,28,36,0.10);
      box-shadow: 0 0 15px rgba(236,28,36,0.10);
    }

    .method-logo {
      width: 100%;
      max-width: 92px;
      height: 38px;
      object-fit: contain;
    }

    .method-name {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .selected-mark {
      display: none;
      position: absolute;
    }

    /* =========================
       FORM
    ========================= */

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .input-box {
      width: 100%;

      background: rgba(0,0,0,0.32);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 11px;

      padding: 13px 14px;

      color: #fff;
      font-size: 15px;
      font-weight: 600;

      outline: none;
      transition: 0.2s;
    }

    .input-box:focus {
      border-color: var(--gold);
      box-shadow: 0 0 10px rgba(255,215,0,0.10);
    }

    .input-box::placeholder {
      color: #687386;
    }

    .limit-box {
      color: var(--gold);
      font-size: 11px;
      font-weight: 600;

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .amount-summary {
      margin-top: 10px;

      background: rgba(255,215,0,0.055);
      border: 1px solid rgba(255,215,0,0.12);
      border-radius: 10px;

      padding: 10px 12px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .amount-summary span:first-child {
      color: var(--muted);
      font-size: 12px;
    }

    .amount-summary span:last-child {
      color: var(--green);
      font-size: 15px;
      font-weight: 800;
    }

    /* =========================
       BUTTON
    ========================= */

    .main-btn {
      width: 100%;

      border: none;
      border-radius: 12px;

      padding: 14px;

      background: var(--gold-gradient);
      color: #000;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;

      transition: 0.2s;
    }

    .main-btn:active {
      transform: scale(0.98);
    }

    .main-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .secondary-btn {
      width: 100%;

      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 11px;

      background: rgba(0,0,0,0.25);
      color: #fff;

      padding: 12px;

      font-size: 13px;
      font-weight: 700;

      cursor: pointer;
    }

    .secondary-btn:active {
      transform: scale(0.98);
    }

    /* =========================
       STEP 2
    ========================= */

    .payment-panel {
      border-radius: 16px;
      padding: 17px;

      display: flex;
      flex-direction: column;
      gap: 14px;

      box-shadow: var(--shadow);
    }

    .payment-panel.bkash {
      background: #e2136e;
      border: 1px solid #ff4da6;
    }

    .payment-panel.nagad {
      background: #ec1c24;
      border: 1px solid #ff5258;
    }

    .payment-title {
      text-align: center;

      font-size: 17px;
      font-weight: 800;

      padding-bottom: 11px;
      border-bottom: 1px solid rgba(255,255,255,0.20);
    }

    .send-amount {
      text-align: center;

      background: rgba(0,0,0,0.25);
      border-radius: 10px;

      padding: 10px;
    }

    .send-amount small {
      display: block;
      font-size: 11px;
      opacity: 0.85;
    }

    .send-amount strong {
      display: block;
      margin-top: 2px;

      color: #fff;
      font-size: 21px;
      font-weight: 800;
    }

    .admin-number-box {
      background: rgba(0,0,0,0.30);
      border-radius: 10px;
      padding: 11px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .admin-number {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.5px;
      word-break: break-all;
    }

    .copy-btn {
      flex-shrink: 0;

      background: rgba(255,255,255,0.22);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 7px;

      color: #fff;

      padding: 6px 9px;
      font-size: 11px;
      font-weight: 800;

      cursor: pointer;
    }

    .instruction-list {
      display: flex;
      flex-direction: column;
      gap: 10px;

      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }

    .instruction-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .instruction-item i {
      font-size: 7px;
      margin-top: 7px;
      flex-shrink: 0;
    }

    .highlight {
      display: inline-block;

      background: rgba(0,0,0,0.30);
      border: 1px dashed rgba(255,255,255,0.45);

      color: var(--gold);

      padding: 2px 8px;
      border-radius: 5px;

      font-weight: 800;
    }

    .trx-input {
      width: 100%;

      background: rgba(255,255,255,0.14);
      border: 1px solid rgba(255,255,255,0.35);
      border-radius: 10px;

      padding: 13px;

      color: #fff;
      text-align: center;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.5px;

      outline: none;
    }

    .trx-input::placeholder {
      color: rgba(255,255,255,0.75);
    }

    .trx-input:focus {
      border-color: #fff;
      background: rgba(255,255,255,0.18);
    }

    .verify-btn {
      width: 100%;

      border: none;
      border-radius: 11px;

      background: #fff;
      color: #000;

      padding: 13px;

      font-size: 15px;
      font-weight: 800;

      cursor: pointer;
    }

    .verify-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* =========================
       HISTORY MODAL
    ========================= */

    #historyModal {
      display: none;

      position: fixed;
      inset: 0;

      background: rgba(0,0,0,0.84);

      z-index: 9999;

      align-items: center;
      justify-content: center;

      padding: 14px;
    }

    #historyModal.show {
      display: flex;
    }

    .history-card {
      width: 100%;
      max-width: 460px;
      max-height: 82vh;

      background: var(--card-bg);

      border: 1px solid var(--border);
      border-radius: 16px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow: 0 10px 40px rgba(0,0,0,0.65);
    }

    .history-header {
      padding: 14px 15px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid rgba(255,255,255,0.08);
    }

    .history-title {
      color: var(--gold);
      font-size: 14px;
      font-weight: 800;

      display: flex;
      align-items: center;
      gap: 7px;
    }

    .close-history {
      width: 32px;
      height: 32px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: rgba(255,255,255,0.06);
      border: none;
      border-radius: 8px;

      color: #fff;
      cursor: pointer;
    }

    .history-body {
      padding: 13px;

      overflow-y: auto;

      display: flex;
      flex-direction: column;
      gap: 9px;
    }

    .history-item {
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 11px;

      padding: 11px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .history-left {
      min-width: 0;

      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .history-amount {
      color: #fff;
      font-size: 14px;
      font-weight: 800;
    }

    .history-meta {
      color: var(--muted);
      font-size: 10px;

      word-break: break-word;
    }

    .history-status {
      flex-shrink: 0;

      padding: 4px 8px;

      border-radius: 6px;

      font-size: 10px;
      font-weight: 800;
    }

    .empty-history {
      text-align: center;
      color: var(--muted);

      padding: 25px 10px;

      font-size: 13px;
    }

    /* =========================
       LOADING
    ========================= */

    .loading-box {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 18px;

      color: var(--muted);
      font-size: 13px;
      gap: 8px;
    }

    .spinner {
      width: 16px;
      height: 16px;

      border: 2px solid rgba(255,255,255,0.20);
      border-top-color: var(--gold);

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 360px) {
      body {
        padding-left: 10px;
        padding-right: 10px;
      }

      .page-title {
        font-size: 15px;
      }

      .method-card {
        min-height: 88px;
      }

      .instruction-list {
        font-size: 12px;
      }

      .admin-number {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="main-wrapper">

    <!-- ================= HEADER ================= -->

    <div class="page-header">

      <a href="index.html" class="back-btn" aria-label="Back">
        <i class="fa-solid fa-arrow-left"></i>
      </a>

      <div class="page-title">
        <i class="fa-solid fa-wallet"></i>
        ডিপোজিট করুন
      </div>

      <button class="history-btn" onclick="openHistoryModal()">
        <i class="fa-solid fa-clock-rotate-left"></i>
        <span>মাই হিস্ট্রি</span>
      </button>

    </div>


    <!-- ================= STEP 1 ================= -->

    <section class="step active" id="step1">

      <!-- Payment Method -->

      <div class="card">

        <div class="section-title">
          <i class="fa-solid fa-credit-card"></i>
          পেমেন্ট মেথড সিলেক্ট করুন
        </div>

        <div class="method-grid">

          <div
            class="method-card bkash"
            id="bkashMethod"
            onclick="selectMethod('bKash', this)"
          >

            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAMwSD3Ygh9kX_gLMze8V4Ed0SAc2ENbt9hav7RFIH9g&s=10"
              class="method-logo"
              alt="bKash"
            >

            <div class="method-name">
              বিকাশ
            </div>

          </div>


          <div
            class="method-card nagad"
            id="nagadMethod"
            onclick="selectMethod('Nagad', this)"
          >

            <img
              src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy-ePfOnTZeIse6MYjisWrece1F7Mqg-9W9v64xzk4d-kqpAZ8AxWty0Di&s=10"
              class="method-logo"
              alt="Nagad"
            >

            <div class="method-name">
              নগদ
            </div>

          </div>

        </div>

      </div>


      <!-- Amount -->

      <div class="card">

        <div class="section-title">
          <i class="fa-solid fa-money-bill-wave"></i>
          ডিপোজিটের পরিমাণ
        </div>

        <div class="form-group">

          <label class="form-label">
            কত টাকা ডিপোজিট করতে চান?
          </label>

          <input
            type="number"
            id="depositAmountInput"
            class="input-box"
            inputmode="numeric"
            min="1"
            placeholder="যেমন: 500"
            autocomplete="off"
          >

          <div class="limit-box">
            <i class="fa-solid fa-circle-info"></i>
            সর্বনিম্ন ডিপোজিট:
            <span id="minLimitDisplay">১০০</span>
            টাকা
          </div>

        </div>


        <div class="amount-summary">

          <span>
            ডিপোজিট পরিমাণ
          </span>

          <span id="amountPreview">
            ৳০
          </span>

        </div>


        <button
          type="button"
          class="main-btn"
          id="continueBtn"
          onclick="continueToPayment()"
        >
          কনফার্ম করুন
          <i class="fa-solid fa-arrow-right"></i>
        </button>

      </div>

    </section>


    <!-- ================= STEP 2 ================= -->

    <section class="step" id="step2">

      <button
        type="button"
        class="secondary-btn"
        onclick="goToStep1()"
      >
        <i class="fa-solid fa-rotate-left"></i>
        পেমেন্ট মেথড পরিবর্তন করুন
      </button>


      <div
        class="payment-panel bkash"
        id="paymentPanel"
      >

        <div class="payment-title">
          ট্রানজেকশন সম্পন্ন করুন
        </div>


        <!-- Amount -->

        <div class="send-amount">

          <small>
            আপনাকে Send Money করতে হবে
          </small>

          <strong id="sendAmountDisplay">
            ৳০
          </strong>

        </div>


        <!-- Instructions -->

        <div
          class="instruction-list"
          id="instructionList"
        >
          <div class="loading-box">
            <div class="spinner"></div>
            তথ্য লোড হচ্ছে...
          </div>
        </div>


        <!-- Admin Number -->

        <div>

          <div
            style="
              font-size:11px;
              font-weight:700;
              margin-bottom:5px;
              opacity:.85;
            "
          >
            Send Money নম্বর
          </div>

          <div class="admin-number-box">

            <span
              class="admin-number"
              id="adminNumberDisplay"
            >
              লোড হচ্ছে...
            </span>

            <button
              type="button"
              class="copy-btn"
              onclick="copyNumber()"
            >
              <i class="fa-solid fa-copy"></i>
              Copy
            </button>

          </div>

        </div>


        <!-- TrxID -->

        <div>

          <div
            style="
              font-size:11px;
              font-weight:700;
              margin-bottom:6px;
              opacity:.9;
            "
          >
            সফল Send Money-এর পর TrxID দিন
          </div>

          <input
            type="text"
            id="trxIdInput"
            class="trx-input"
            placeholder="Transaction ID"
            maxlength="30"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
          >

        </div>


        <button
          type="button"
          class="verify-btn"
          id="verifyBtn"
          onclick="submitDepositRequest()"
        >
          <i class="fa-solid fa-circle-check"></i>
          VERIFY
        </button>

      </div>

    </section>

  </div>


  <!-- ================= HISTORY MODAL ================= -->

  <div id="historyModal">

    <div class="history-card">

      <div class="history-header">

        <div class="history-title">
          <i class="fa-solid fa-clock-rotate-left"></i>
          গত ৭ দিনের হিস্ট্রি
        </div>

        <button
          class="close-history"
          onclick="closeHistoryModal()"
          aria-label="Close"
        >
          <i class="fa-solid fa-xmark"></i>
        </button>

      </div>

      <div
        class="history-body"
        id="historyListContainer"
      >
        <div class="loading-box">
          <div class="spinner"></div>
          লোড হচ্ছে...
        </div>
      </div>

    </div>

  </div>


  <!-- ================= FIREBASE ================= -->

  <script type="module">

    import {
      initializeApp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      query,
      where,
      doc,
      getDoc,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


    /* ================= FIREBASE CONFIG ================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",

      authDomain:
        "kopa-samsu-95941.firebaseapp.com",

      projectId:
        "kopa-samsu-95941",

      storageBucket:
        "kopa-samsu-95941.firebasestorage.app",

      messagingSenderId:
        "949740806870",

      appId:
        "1:949740806870:web:52e745bba2436172481f77"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);

    const db = getFirestore(app);


    /* ================= VARIABLES ================= */

    let currentUser = null;

    let selectedMethodName = "";

    let enteredAmount = 0;

    let activeAdminNumber = "";

    let minLimit = 100;

    let cachedDepositHistory = [];

    let submitting = false;

    const fallbackNumbers = {

      bKash: "01632615941",

      Nagad: "01839643527"

    };


    /* ================= SAFE HTML ================= */

    function escapeHTML(value) {

      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* ================= BANGLA NUMBER ================= */

    function toBanglaNumber(value) {

      const map = {
        "0": "০",
        "1": "১",
        "2": "২",
        "3": "৩",
        "4": "৪",
        "5": "৫",
        "6": "৬",
        "7": "৭",
        "8": "৮",
        "9": "৯"
      };

      return String(value)
        .replace(/[0-9]/g, digit => map[digit]);

    }


    function formatMoney(value) {

      const number = Number(value || 0);

      return number.toLocaleString("bn-BD");

    }

    onAuthStateChanged(auth, async (user) => {

    /* ================= SETTINGS ================= */

    async function loadGeneralSettings() {

      try {

        const settingsRef =
          doc(db, "settings", "general");

        const settingsSnap =
          await getDoc(settingsRef);


        if (settingsSnap.exists()) {

          const settings =
            settingsSnap.data();


          const configuredLimit =
            Number(settings.minDeposit);


          if (
            Number.isFinite(configuredLimit) &&
            configuredLimit > 0
          ) {

            minLimit = configuredLimit;

          }

        }

      } catch (error) {

        console.error(
          "Settings load error:",
          error
        );

        minLimit = 100;

      }


      document.getElementById(
        "minLimitDisplay"
      ).innerText =
        formatMoney(minLimit);

    }

          where(

          await getDocs(paymentQuery);

          const data =
            snapshot.docs[0].data();


          if (
            data.number &&
            String(data.number).trim()
          ) {

              String(data.number).trim();

          }

        }


        if (!activeAdminNumber) {

          activeAdminNumber =
            fallbackNumbers[
              selectedMethodName
            ];

        }

      } catch (error) {

        console.error(

    /* ================= TRX NORMALIZE ================= */

    function normalizeTrxId(value) {

      return String(value || "")
        .trim()
        .replace(/\s+/g, "")
        .toUpperCase();

    }


    /* ================= TRX VALIDATION ================= */

    function isValidTrxId(trxId) {

      /*
       * bKash/Nagad TrxID সাধারণত
       * অক্ষর + সংখ্যা দিয়ে তৈরি।
       * অতিরিক্ত কঠোর pattern না দিয়ে
       * ৮-৩০ character রাখা হয়েছে।
       */

      return /^[A-Z0-9]{8,30}$/.test(
        trxId
      );

    }


    /* ================= CHECK DUPLICATE ================= */

    async function checkDuplicateTrxId(
      trxId
    ) {

      const trxQuery = query(

        collection(
          db,
          "deposits"
        ),

        where(
          "trxId",
          "==",
          trxId
        )

      );


      const snapshot =
        await getDocs(trxQuery);


      return !snapshot.empty;

    }

    /* ================= REALTIME HISTORY ================= */

    function initRealtimeHistory(uid) {

      if (historyUnsubscribe) {

        historyUnsubscribe();

        historyUnsubscribe = null;

      }


      const historyQuery =
        query(

          collection(
            db,
            "deposits"
          ),

          where(
            "userId",
            "==",
            uid
          )

        );


      historyUnsubscribe =
        onSnapshot(

          historyQuery,

          snapshot => {

            cachedDepositHistory = [];


            snapshot.forEach(
              docSnap => {

                cachedDepositHistory.push({

                  id:
                    docSnap.id,

                  ...docSnap.data()

                });

              }
            );


            cachedDepositHistory.sort(
              (a, b) => {

                const timeA =
                  a.createdAt &&
                  typeof a.createdAt.toMillis ===
                    "function"

                    ? a.createdAt.toMillis()

                    : 0;


                const timeB =
                  b.createdAt &&
                  typeof b.createdAt.toMillis ===
                    "function"

                    ? b.createdAt.toMillis()

                    : 0;


                return timeB - timeA;

              }
            );


            /*
             * Modal বর্তমানে খোলা থাকলে
             * realtime update দেখাবে।
             */

            const modal =
              document.getElementById(
                "historyModal"
              );


            if (
              modal.classList.contains(
                "show"
              )
            ) {

              renderHistoryList(
                cachedDepositHistory
              );

            }

          },

          error => {

            console.error(
              "History realtime error:",
              error
            );

          }

        );

    }

    /* ================= RENDER HISTORY ================= */

    function renderHistoryList(
      historyData
    ) {

      const container =
        document.getElementById(
          "historyListContainer"
        );


      container.innerHTML = "";


      if (
        !historyData ||
        historyData.length === 0
      ) {

        container.innerHTML = `
          <div class="empty-history">
            কোনো ডিপোজিট রিকোয়েস্ট নেই।
          </div>
        `;

        return;

      }


      const sevenDaysAgo =
        new Date();


      sevenDaysAgo.setDate(
        sevenDaysAgo.getDate() - 7
      );


      let visibleCount = 0;


      historyData.forEach(
        data => {

          let createdAt;


          if (
            data.createdAt &&
            typeof data.createdAt.toDate ===
              "function"
          ) {

            createdAt =
              data.createdAt.toDate();

          } else {

            /*
             * serverTimestamp pending অবস্থায়
             * createdAt null হতে পারে।
             * সেক্ষেত্রে বর্তমানে history-তে
             * সেটি বাদ দেওয়া হচ্ছে না।
             */

            createdAt =
              new Date();

          }


          if (
            createdAt < sevenDaysAgo
          ) {

            return;

          }


          visibleCount++;


          let statusText =
            "পেন্ডিং";

          let statusColor =
            "#ff9800";


          if (
            data.status ===
            "approved"
          ) {

            statusText =
              "কনফার্মড";

            statusColor =
              "#00e676";

          }

          else if (
            data.status ===
            "rejected"
          ) {

            statusText =
              "রিজেক্টেড";

            statusColor =
              "#ff5252";

          }

          else if (
            data.status ===
            "cancelled"
          ) {

            statusText =
              "বাতিল";

            statusColor =
              "#ff5252";

          }


          const methodName =
            data.method === "bKash"
              ? "বিকাশ"
              : data.method === "Nagad"
                ? "নগদ"
                : (
                    data.method ||
                    "Unknown"
                  );


          const dateStr =
            createdAt.toLocaleString(
              "bn-BD",
              {
                day: "numeric",
                month: "short",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }
            );


          const amount =
            formatMoney(
              Number(data.amount || 0)
            );


          const trxId =
            escapeHTML(
              data.trxId ||
              "N/A"
            );


          const item =
            document.createElement(
              "div"
            );


          item.className =
            "history-item";


          item.innerHTML = `

            <div class="history-left">

              <div class="history-amount">
                ৳${amount}
                <span
                  style="
                    color:#ffd700;
                    font-size:11px;
                  "
                >
                  (${escapeHTML(methodName)})
                </span>
              </div>

              <div class="history-meta">
                TrxID:
                ${trxId}
              </div>

              <div class="history-meta">
                ${escapeHTML(dateStr)}
              </div>

            </div>


            <div
              class="history-status"
              style="
                color:${statusColor};
                background:${statusColor}22;
              "
            >
              ${statusText}
            </div>

          `;


          container.appendChild(
            item
          );

        }
      );


      if (visibleCount === 0) {

        container.innerHTML = `
          <div class="empty-history">
            গত ৭ দিনের মধ্যে কোনো ডিপোজিট রিকোয়েস্ট নেই।
          </div>
        `;

      }

    }


    /* ================= TRX INPUT ================= */

    document
      .getElementById("trxIdInput")
      .addEventListener(
        "input",
        function () {

          /*
           * TrxID-তে space না রাখা।
           */

          this.value =
            this.value
              .replace(/\s/g, "")
              .toUpperCase();

        }
      );


    /* ================= AMOUNT ENTER ================= */

    document
      .getElementById(
        "depositAmountInput"
      )
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            continueToPayment();

          }

        }
      );


    /* ================= TRX ENTER ================= */

    document
      .getElementById(
        "trxIdInput"
      )
      .addEventListener(
        "keydown",
        function (event) {

          if (
            event.key === "Enter"
          ) {

            event.preventDefault();

            submitDepositRequest();

          }

        }
      );

  </script>

</body>
</html>
