<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ডিপোজিট করুন | DON</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --accent-gold: #fbbf24;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: var(--bg-dark); background-image: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text-main); min-height: 100vh; padding-bottom: 40px; }

    .glass-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      box-shadow: var(--glass-shadow);
    }

    /* Navbar */
    .navbar {
      padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; 
      position: sticky; top: 0; z-index: 100; border-bottom: 1px solid var(--glass-border);
      background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(10px);
    }
    .brand { font-size: 18px; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
    .back-btn { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: #fff; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; }

    /* History Button Box in Top Bar */
    .history-btn-box {
      display: flex; flex-direction: column; align-items: center; gap: 2px;
      color: #fff; text-decoration: none; cursor: pointer; background: transparent; border: none;
    }
    .history-btn-box span { font-size: 10px; font-weight: 700; color: var(--accent-gold); }

    .main-container { max-width: 500px; margin: 20px auto; padding: 0 16px; display: flex; flex-direction: column; gap: 20px; }

    /* Step Containers */
    .step-box { display: none; flex-direction: column; gap: 16px; }
    .step-box.active { display: flex; }

    /* Method Cards */
    .methods-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 5px; }
    .method-card {
      background: rgba(15, 23, 42, 0.6); border: 2px solid var(--glass-border); border-radius: 14px;
      padding: 16px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .method-card:hover { border-color: var(--accent-gold); transform: translateY(-3px); }
    .method-card.bkash.selected { border-color: #e2136e; background: rgba(226, 19, 110, 0.1); }
    .method-card.nagad.selected { border-color: #ec1c24; background: rgba(236, 28, 36, 0.1); }

    .method-logo { width: 100%; max-width: 100px; height: 42px; object-fit: contain; }
    .method-name { font-size: 15px; font-weight: 700; color: #fff; }

    /* Form Elements */
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 13px; color: var(--text-sub); font-weight: 600; }
    .form-control {
      width: 100%; padding: 14px; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border);
      border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: 0.3s;
    }
    .form-control:focus { border-color: var(--accent-gold); box-shadow: 0 0 10px rgba(251,191,36,0.2); }
    
    .min-limit-text { font-size: 12px; color: var(--accent-gold); font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 5px; }

    .btn-main {
      width: 100%; padding: 14px; background: linear-gradient(135deg, var(--accent-gold), #d97706);
      border: none; border-radius: 12px; color: #000; font-weight: 800; font-size: 16px; cursor: pointer; 
      display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; margin-top: 5px;
    }
    .btn-main:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(251,191,36,0.3); }

    /* Step 2: Instruction & Trx Card */
    .trx-container {
      border-radius: 16px; padding: 20px; color: #fff; display: flex; flex-direction: column; gap: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    .trx-bkash { background: #e2136e; border: 1px solid #ff4da6; }
    .trx-nagad { background: #ec1c24; border: 1px solid #ff5258; }

    .trx-title { text-align: center; font-size: 18px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; }
    
    .trx-input {
      width: 100%; padding: 14px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4);
      border-radius: 10px; color: #fff; font-size: 16px; font-weight: 700; outline: none; text-align: center;
    }
    .trx-input::placeholder { color: rgba(255,255,255,0.8); }

    .instruction-list { display: flex; flex-direction: column; gap: 10px; font-size: 14px; font-weight: 500; }
    .instruction-item { display: flex; align-items: flex-start; gap: 10px; line-height: 1.4; }
    .instruction-item i { margin-top: 3px; font-size: 10px; }

    .highlight-send {
      background: rgba(0, 0, 0, 0.35); padding: 4px 10px; border-radius: 6px;
      color: #fbbf24; font-weight: 800; border: 1px dashed rgba(255,255,255,0.5); display: inline-block;
    }

    .copy-box {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.3);
      padding: 6px 12px; border-radius: 8px; font-weight: 700; font-size: 16px; margin: 2px 0;
    }
    .btn-copy {
      background: rgba(255,255,255,0.25); border: none; padding: 4px 8px; border-radius: 6px;
      color: #fff; font-size: 12px; cursor: pointer; font-weight: 750; transition: 0.2s;
    }
    .btn-copy:hover { background: rgba(255,255,255,0.5); }

    .btn-change-method {
      background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2); color: #fff;
      padding: 12px; border-radius: 12px; font-weight: 700; cursor: pointer; text-align: center; transition: 0.3s;
    }
    .btn-change-method:hover { background: rgba(0,0,0,0.5); }

    /* History Modal Style */
    #historyModal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; padding: 15px;
    }
    .history-card {
      background: var(--card-bg); border: 1px solid var(--glass-border);
      border-radius: 16px; width: 100%; max-width: 450px; max-height: 80vh;
      display: flex; flex-direction: column; overflow: hidden; backdrop-filter: blur(15px);
    }
    .history-header {
      padding: 15px; border-bottom: 1px solid var(--glass-border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .history-body {
      padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="brand"><i class="fa-solid fa-wallet"></i> ডিপোজিট করুন</div>
    <button onclick="openHistoryModal()" class="history-btn-box">  
      <i class="fa-solid fa-clock-rotate-left" style="font-size: 18px;"></i>  
      <span>মাই হিস্ট্রি</span>  
    </button>
  </nav>

  <div class="main-container">

    <!-- STEP 1: Select Method & Amount -->
    <div class="step-box active" id="step1">
      <button class="btn-change-method" id="changeMethodTopBtn" style="display:none; margin-bottom:0;" onclick="goToStep1()">পেমেন্ট মেথড পরিবর্তন করুন</button>
      
      <div class="glass-panel" style="padding: 20px;">
        <div style="font-size: 16px; font-weight: 800; color: var(--accent-gold); margin-bottom: 12px;">
          <i class="fa-solid fa-credit-card"></i> পেমেন্ট মেথড সিলেক্ট করুন
        </div>
        
        <div class="methods-grid">
          <div class="method-card bkash" onclick="selectMethod('bKash', this)">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAMwSD3Ygh9kX_gLMze8V4Ed0SAc2ENbt9hav7RFIH9g&s=10" alt="bKash" class="method-logo">
            <div class="method-name">বিকাশ</div>
          </div>
          <div class="method-card nagad" onclick="selectMethod('Nagad', this)">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQy-ePfOnTZeIse6MYjisWrece1F7Mqg-9W9v64xzk4d-kqpAZ8AxWty0Di&s=10" alt="Nagad" class="method-logo">
            <div class="method-name">নগদ</div>
          </div>
        </div>
      </div>

      <div class="glass-panel" style="padding: 20px;" id="amountCardSection">
        <form id="depositAmountForm">
          <div class="form-group">
            <label>ডিপোজিট পরিমাণ (টাকা)</label>
            <input type="number" id="depositAmountInput" class="form-control" placeholder="যেমন: 500" required>
            <div class="min-limit-text">
              <i class="fa-solid fa-circle-info"></i> সর্বনিম্ন ডিপোজিট: <span id="minLimitDisplay">১০০</span> টাকা
            </div>
          </div>
          <button type="submit" class="btn-main" style="margin-top: 15px;">কনফার্ম করুন <i class="fa-solid fa-arrow-right"></i></button>
        </form>
      </div>
    </div>

    <!-- STEP 2: TrxID & Instructions Page -->
    <div class="step-box" id="step2">
      <button class="btn-change-method" onclick="goToStep1()"><i class="fa-solid fa-rotate-left"></i> পেমেন্ট মেথড পরিবর্তন করুন</button>

      <div class="trx-container" id="trxContainerBox">
        <div class="trx-title">ট্রানজেকশন আইডি দিন</div>

        <input type="text" id="trxIdInput" class="trx-input" placeholder="ট্রানজেকশন আইডি দিন" required>

        <div class="instruction-list" id="instructionListText"></div>

        <button type="button" class="btn-main" id="verifyBtn" onclick="submitDepositRequest()" style="background: #fff; color: #000;">VERIFY</button>
      </div>
    </div>

  </div>

  <!-- History Modal -->
  <div id="historyModal">
    <div class="history-card">
      <div class="history-header">
        <span style="font-weight:700; color:var(--accent-gold);"><i class="fa-solid fa-history"></i> গত ৭ দিনের হিস্ট্রি</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer; font-size:18px;" onclick="closeHistoryModal()"></i>
      </div>
      <div class="history-body" id="historyListContainer">
        <div style="text-align:center; color:var(--text-sub);">লোড হচ্ছে...</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, query, where, doc, getDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let selectedMethodName = '';
    let enteredAmount = 0;
    let activeAdminNumber = ''; 
    let minLimit = 100;
    let currentUser = null;
    let cachedDepositHistory = [];

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
      } else {
        currentUser = user;
        try {
          const limitSnap = await getDoc(doc(db, "settings", "general"));
          if(limitSnap.exists() && limitSnap.data().minDeposit) {
            minLimit = Number(limitSnap.data().minDeposit);
          }
        } catch(e) {
          minLimit = 100;
        }
        document.getElementById('minLimitDisplay').innerText = minLimit;
        initRealtimeHistory(user.uid);
      }
    });

    // রিয়েল-টাইম ডিপোজিট হিস্ট্রি ট্র্যাক করা
    function initRealtimeHistory(uid) {
      const q = query(collection(db, "deposits"), where("userId", "==", uid));
      onSnapshot(q, (snapshot) => {
        cachedDepositHistory = [];
        snapshot.forEach((docSnap) => {
          cachedDepositHistory.push({ id: docSnap.id, ...docSnap.data() });
        });

        // নতুন থেকে পুরোনো (Descending) অর্ডারে সাজানো
        cachedDepositHistory.sort((a, b) => {
          const timeA = a.createdAt && a.createdAt.toMillis ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt && b.createdAt.toMillis ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        });
      });
    }

    window.openHistoryModal = () => {
      if (!currentUser) return;
      document.getElementById('historyModal').style.display = 'flex';
      renderHistoryList(cachedDepositHistory);
    };

    function renderHistoryList(historyData) {
      const container = document.getElementById('historyListContainer');
      container.innerHTML = '';

      if (!historyData || historyData.length === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">কোনো ডিপোজিট রিকোয়েস্ট নেই।</div>';
        return;
      }

      const sevenDaysAgo = new Date();
      sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);

      let count = 0;
      historyData.forEach(data => {
        const createdAt = data.createdAt && data.createdAt.toDate ? data.createdAt.toDate() : new Date();

        if (createdAt >= sevenDaysAgo) {
          count++;
          let statusText = 'পেন্ডিং';
          let statusColor = '#fbbf24';

          if (data.status === 'approved') {
            statusText = 'কনফার্মড';
            statusColor = '#10b981';
          } else if (data.status === 'rejected') {
            statusText = 'রিজেক্টেড';
            statusColor = '#ef4444';
          }

          const dateStr = createdAt.toLocaleString('bn-BD', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'short' });
          const methodName = data.method === 'bKash' ? 'বিকাশ' : (data.method === 'Nagad' ? 'নগদ' : data.method);

          const itemHTML = `
            <div style="background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.08); border-radius:10px; padding:12px; display:flex; justify-content:space-between; align-items:center;">
              <div style="display:flex; flex-direction:column; gap:4px;">
                <span style="font-weight:700; font-size:14px;">৳${data.amount} (${methodName})</span>
                <span style="font-size:11px; color:var(--text-sub);">TrxID: ${data.trxId} • ${dateStr}</span>
              </div>
              <span style="font-size:12px; font-weight:700; color:${statusColor}; background:${statusColor}22; padding:4px 8px; border-radius:6px;">${statusText}</span>
            </div>
          `;
          container.innerHTML += itemHTML;
        }
      });

      if (count === 0) {
        container.innerHTML = '<div style="text-align:center; color:var(--text-sub); padding:20px;">গত ৭ দিনের মধ্যে কোনো ডিপোজিট রিকোয়েস্ট নেই।</div>';
      }
    }

    window.closeHistoryModal = () => {
      document.getElementById('historyModal').style.display = 'none';
    };

    window.selectMethod = async (method, element) => {
      selectedMethodName = method;

      document.querySelectorAll('.method-card').forEach(el => {
        el.classList.remove('selected');
      });

      element.classList.add('selected');

      try {
        const q = query(
          collection(db, "payment_numbers"),
          where("method", "==", selectedMethodName),
          where("isActive", "==", true)
        );

        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
          activeAdminNumber = querySnapshot.docs[0].data().number;
        } else {
          activeAdminNumber = selectedMethodName === 'bKash' ? '01632615941' : '01839643527';
        }

        if (document.getElementById('step2').classList.contains('active')) {
          setupStep2Content();
        }
      } catch (e) {
        activeAdminNumber = selectedMethodName === 'bKash' ? '01632615941' : '01839643527';
        if (document.getElementById('step2').classList.contains('active')) {
          setupStep2Content();
        }
      }
    };

    document.getElementById('depositAmountForm').addEventListener('submit', (e) => {
      e.preventDefault();
      if(!selectedMethodName) {
        Swal.fire({ title: 'সতর্কতা', text: 'দয়া করে বিকাশ অথবা নগদ সিলেক্ট করুন!', icon: 'warning', background: '#1e293b', color: '#fff' });
        return;
      }
      
      enteredAmount = Number(document.getElementById('depositAmountInput').value);
      
      if(enteredAmount < minLimit) {
        Swal.fire({ 
          title: 'সীমা অতিক্রম করেছে!', 
          text: `সর্বনিম্ন ডিপোজিট পরিমাণ ${minLimit} টাকা। এর কম ডিপোজিট করা যাবে না।`, 
          icon: 'error', 
          background: '#1e293b', 
          color: '#fff' 
        });
        return;
      }

      document.getElementById('step1').classList.remove('active');
      document.getElementById('step2').classList.add('active');
      document.getElementById('changeMethodTopBtn').style.display = 'block';

      setupStep2Content();
    });

    function setupStep2Content() {
      const containerBox = document.getElementById('trxContainerBox');
      const listEl = document.getElementById('instructionListText');
      const isBkash = selectedMethodName === 'bKash';
      const mNameCaps = isBkash ? 'BKASH' : 'NAGAD';
      const dialCode = isBkash ? '*247#' : '*167#';

      if(isBkash) {
        containerBox.className = "trx-container trx-bkash";
      } else {
        containerBox.className = "trx-container trx-nagad";
      }

      listEl.innerHTML = `
        <div class="instruction-item"><i class="fa-solid fa-circle"></i> ${dialCode} ডায়াল করে আপনার ${mNameCaps} মোবাইল মেনুতে যান অথবা ${mNameCaps} অ্যাপে যান।</div>
        <div class="instruction-item"><i class="fa-solid fa-circle"></i> <span class="highlight-send">Send Money</span> অপশনে ক্লিক করুন।</div>
        <div class="instruction-item"><i class="fa-solid fa-circle"></i> প্রাপক নম্বর হিসেবে নিচের এই নম্বরটি লিখুন <br>
          <div class="copy-box">
            <span id="adminNumSpan">${activeAdminNumber}</span>
            <button class="btn-copy" onclick="copyNumber()"><i class="fa-solid fa-copy"></i> Copy</button>
          </div>
        </div>
        <div class="instruction-item"><i class="fa-solid fa-circle"></i> নিশ্চিত করতে এখন আপনার ${mNameCaps} মোবাইল মেনু পিন লিখুন।</div>
        <div class="instruction-item"><i class="fa-solid fa-circle"></i> সফল হওয়ার পর প্রাপ্ত Transaction ID টি উপরের বক্সে লিখে VERIFY বাটনে ক্লিক করুন।</div>
      `;
    }

    window.goToStep1 = () => {
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step1').classList.add('active');
      document.getElementById('trxIdInput').value = '';
    };

    window.copyNumber = async () => {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(activeAdminNumber);
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = activeAdminNumber;
          textArea.style.position = "fixed";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          document.execCommand('copy');
          textArea.remove();
        }
        
        Swal.fire({ title: 'কপি হয়েছে!', text: activeAdminNumber, icon: 'success', timer: 1500, showConfirmButton: false, background: '#1e293b', color: '#fff' });
      } catch (err) {
        Swal.fire({ title: 'ত্রুটি', text: 'নম্বরটি কপি করা যায়নি।', icon: 'error', background: '#1e293b', color: '#fff' });
      }
    };

    window.submitDepositRequest = async () => {
      const trxId = document.getElementById('trxIdInput').value.trim();
      const trxRegex = /^[A-Za-z0-9]{8,15}$/;
      if(!trxId || !trxRegex.test(trxId)) {
        Swal.fire({ title: 'ভুল ট্রানজেকশন আইডি!', text: 'দয়া করে সঠিক ট্রানজেকশন আইডি (TrxID) প্রদান করুন।', icon: 'warning', background: '#1e293b', color: '#fff' });
        return;
      }

      if(!currentUser) return;

      try {
        await addDoc(collection(db, "deposits"), {
          userId: currentUser.uid,
          userEmail: currentUser.email,
          method: selectedMethodName, 
          amount: enteredAmount,
          trxId: trxId,
          status: 'pending',
          createdAt: serverTimestamp()
        });

        Swal.fire({
          title: 'সফল!',
          text: 'আপনার ডিপোজিট রিকোয়েস্ট সফলভাবে সাবমিট হয়েছে।',
          icon: 'success',
          background: '#1e293b',
          color: '#fff'
        }).then(() => {
          window.location.href = "index.html";
        });

      } catch(err) {
        Swal.fire({ title: 'ত্রুটি', text: 'রিকোয়েস্ট সাবমিট করতে সমস্যা হয়েছে', icon: 'error', background: '#1e293b', color: '#fff' });
      }
    };
  </script>
</body>
</html>
