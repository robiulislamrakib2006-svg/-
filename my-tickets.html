<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>আমার টিকিটসমূহ - কোপা সামসু লটারি</title>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.9);
      --gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      --accent-green: #00e676;
      --accent-red: #ff4d4d;
      --text-muted: #a0aec0;
      --border-color: rgba(255, 215, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: var(--bg-color); color: #fff; padding: 15px; display: flex; justify-content: center; }

    .main-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }

    .top-bar { 
      display: flex; align-items: center; justify-content: space-between; 
      background: var(--card-bg); padding: 12px 16px; border-radius: 14px; 
      border: 1px solid var(--border-color); 
    }
    .back-btn { color: #fff; font-size: 18px; text-decoration: none; }
    .page-title { font-size: 16px; font-weight: 800; color: var(--gold); }

    .filter-tabs { display: flex; gap: 8px; background: rgba(255, 255, 255, 0.04); padding: 6px; border-radius: 12px; }
    .tab-btn {
      flex: 1; padding: 8px; border: none; background: transparent; color: var(--text-muted);
      font-weight: 700; font-size: 12px; border-radius: 8px; cursor: pointer; transition: all 0.2s;
    }
    .tab-btn.active { background: var(--gold-gradient); color: #000; }

    .ticket-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 16px; padding: 16px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }
    
    .ticket-top { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255, 255, 255, 0.1); padding-bottom: 8px; }
    .ticket-serial { font-size: 16px; font-weight: 800; color: var(--gold); letter-spacing: 0.5px; }
    .ticket-price { font-size: 14px; font-weight: 700; color: #fff; }

    .ticket-details { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-muted); }
    .ticket-time { display: flex; align-items: center; gap: 6px; }

    .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
    .status-pending { background: rgba(255, 215, 0, 0.15); color: var(--gold); border: 1px solid rgba(255, 215, 0, 0.3); }
    .status-won { background: rgba(0, 230, 118, 0.15); color: var(--accent-green); border: 1px solid rgba(0, 230, 118, 0.3); }
    .status-lost { background: rgba(255, 77, 77, 0.15); color: var(--accent-red); border: 1px solid rgba(255, 77, 77, 0.3); }

    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 10px; font-size: 14px; }
    .empty-state i { font-size: 40px; color: rgba(255,255,255,0.2); margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="top-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="page-title"><i class="fa-solid fa-ticket"></i> আমার সকল টিকিট</div>
      <div style="width: 18px;"></div>
    </div>

    <!-- ৩টি ট্যাব: পেন্ডিং, বিজয়ী, পরাজিত -->
    <div class="filter-tabs">
      <button class="tab-btn active" onclick="filterTickets('pending', this)">পেন্ডিং</button>
      <button class="tab-btn" onclick="filterTickets('won', this)">বিজয়ী</button>
      <button class="tab-btn" onclick="filterTickets('lost', this)">পরাজিত</button>
    </div>

    <div id="ticketsList" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="empty-state">টিকিট লোড হচ্ছে...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, collection, query, where, onSnapshot, getDocs 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let allTickets = [];
    let activeFilter = 'pending';

    onAuthStateChanged(auth, (user) => {
      if (user) {
        fetchMyTickets(user.uid);
      } else {
        window.location.href = "login.html";
      }
    });

    async function fetchMyTickets(uid) {
      const q = query(
        collection(db, "tickets"),
        where("userId", "==", uid)
      );

      onSnapshot(q, async (snapshot) => {
        allTickets = [];
        
        // ডাটাবেজে বর্তমানে কোন কোন স্লটগুলো অ্যাক্টিভ আছে তাদের আইডি সংগ্রহ করা
        let activeSlotIds = new Set();
        try {
          const slotsSnapshot = await getDocs(collection(db, "slots"));
          slotsSnapshot.forEach(docSnap => {
            activeSlotIds.add(docSnap.id);
          });
        } catch (e) {
          console.error("Slots fetch error:", e);
        }

        for (const docSnap of snapshot.docs) {
          const ticketData = { id: docSnap.id, ...docSnap.data() };
          const status = ticketData.status || 'pending';

          // যদি টিকিটটি পেন্ডিং বা অ্যাক্টিভ অবস্থায় থাকে
          if (status === 'pending' || status === 'active') {
            // ১. স্লটটি যদি এডমিন প্যানেল থেকে ডিলিট করা হয় (অর্থাৎ activeSlotIds-এ না থাকে)
            // ২. অথবা স্লটের ড্র যদি কমপ্লিট হয়ে যায় (যদি স্লটে status বা completed ফিল্ড থাকে)
            let isSlotDeletedOrCompleted = false;
            
            if (!ticketData.slotId || !activeSlotIds.has(ticketData.slotId)) {
              isSlotDeletedOrCompleted = true;
            } else {
              // স্লট ডাটা থেকে চেক করা যেতে পারে ড্র হয়ে গেছে কি না
              // আপনি যদি স্লট ডকুমেন্টে status == 'completed' বা 'drawn' সেভ করেন তবে সেটিও এখানে চেক করা যাবে
            }

            // যদি স্লট ডিলিট বা ড্র শেষ হয়ে যায়, তবে পেন্ডিং তালিকা থেকে বাদ যাবে
            if (isSlotDeletedOrCompleted) {
              continue; 
            }
          }

          allTickets.push(ticketData);
        }

        // সময় অনুযায়ী লেটেস্ট টিকিট উপরে সাজানো
        allTickets.sort((a, b) => {
          const timeA = a.createdAt ? (a.createdAt.seconds || new Date(a.createdAt).getTime()) : 0;
          const timeB = b.createdAt ? (b.createdAt.seconds || new Date(b.createdAt).getTime()) : 0;
          return timeB - timeA;
        });

        renderTickets();
      }, (error) => {
        console.error("Error fetching tickets:", error);
      });
    }

    window.filterTickets = (filter, btn) => {
      activeFilter = filter;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderTickets();
    };

    function renderTickets() {
      const container = document.getElementById('ticketsList');
      let filtered = [];

      if (activeFilter === 'pending') {
        // শুধু পেন্ডিং বা যেগুলোর স্ট্যাটাস pending/active
        filtered = allTickets.filter(t => t.status === 'pending' || t.status === 'active' || !t.status);
      } else if (activeFilter === 'won') {
        // শুধু জয়ী টিকিট
        filtered = allTickets.filter(t => t.status === 'won');
      } else if (activeFilter === 'lost') {
        // শুধু পরাজিত টিকিট
        filtered = allTickets.filter(t => t.status === 'lost');
      }

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-ticket-simple"></i>
            <div>কোনো টিকিট পাওয়া যায়নি!</div>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach((ticket) => {
        let dateStr = 'N/A';
        if (ticket.createdAt) {
          const dateObj = ticket.createdAt.toDate ? ticket.createdAt.toDate() : new Date(ticket.createdAt);
          dateStr = dateObj.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) + 
                    ' (' + dateObj.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' }) + ')';
        }

        const serialCode = ticket.ticketId || ('#KS-' + ticket.id.substring(0, 6).toUpperCase());

        let statusBadge = '';
        if (ticket.status === 'won') {
          statusBadge = `<span class="status-badge status-won"><i class="fa-solid fa-trophy"></i> বিজয়ী (৳${ticket.prizeMoney || ticket.prizeAmount || 0})</span>`;
        } else if (ticket.status === 'lost') {
          statusBadge = `<span class="status-badge status-lost"><i class="fa-solid fa-xmark"></i> পরাজিত</span>`;
        } else {
          statusBadge = `<span class="status-badge status-pending"><i class="fa-solid fa-clock"></i> অপেক্ষমাণ</span>`;
        }

        html += `
          <div class="ticket-card">
            <div class="ticket-top">
              <div class="ticket-serial"><i class="fa-solid fa-barcode"></i> ${serialCode}</div>
              <div class="ticket-price">মূল্য: ৳${ticket.price || 0}</div>
            </div>
            <div class="ticket-details">
              <div class="ticket-time"><i class="fa-regular fa-calendar-check"></i> ${dateStr}</div>
              ${statusBadge}
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
    }
  </script>
</body>
</html>
