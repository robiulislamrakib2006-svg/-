<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>টিকিট কিনুন - কোপা সামসু লটারি</title>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.9);
      --gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      --accent-green: #00e676;
      --accent-red: #ff4d4d;
      --text-muted: #a0aec0;
      --border-color: rgba(255, 215, 0, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; }
    body { background: var(--bg-color); color: #fff; padding: 15px; display: flex; justify-content: center; }

    .main-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 15px; }

    .top-bar { display: flex; align-items: center; justify-content: space-between; background: var(--card-bg); padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border-color); }
    .back-btn { color: #fff; font-size: 18px; text-decoration: none; }
    .page-title { font-size: 16px; font-weight: 800; color: var(--gold); }
    .user-balance { font-size: 14px; font-weight: 700; color: var(--accent-green); background: rgba(0, 230, 118, 0.1); padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(0,230,118,0.2); }

    .slot-card {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 18px; padding: 16px; position: relative; overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 12px;
    }

    .slot-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed rgba(255,255,255,0.1); padding-bottom: 10px; }
    .ticket-price { font-size: 22px; font-weight: 900; color: var(--gold); }
    .slot-limit { font-size: 12px; color: var(--text-muted); background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; }

    .slot-info { font-size: 13px; color: #e2e8f0; line-height: 1.5; }
    .slot-info i { color: var(--gold); width: 18px; text-align: center; }

    .progress-box { background: rgba(0,0,0,0.3); padding: 8px 10px; border-radius: 8px; }
    .progress-text { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--gold-gradient); border-radius: 10px; transition: width 0.3s; }

    .btn-buy {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: var(--gold-gradient); color: #000; font-size: 15px; font-weight: 800;
      cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px;
      transition: all 0.2s;
    }
    .btn-buy:disabled { background: #4a5568; color: #a0aec0; cursor: not-allowed; }

    .swal2-popup { background: #121624 !important; color: #fff !important; border: 1px solid var(--gold) !important; border-radius: 20px !important; }
    .swal2-title { color: var(--gold) !important; }
    .swal2-confirm { background: var(--gold-gradient) !important; color: #000 !important; font-weight: 800 !important; border-radius: 10px !important; }
    .swal2-cancel { background: rgba(255,255,255,0.1) !important; color: #fff !important; border-radius: 10px !important; }
  </style>
</head>
<body>

  <div class="main-wrapper">
    <div class="top-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="page-title"><i class="fa-solid fa-ticket"></i> লটারি স্লটসমূহ</div>
      <div class="user-balance">৳ <span id="currentBalance">0.00</span></div>
    </div>

    <div id="slotsContainer">
      <div style="text-align: center; color: var(--text-muted); padding: 20px;">স্লট লোড হচ্ছে...</div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, collection, onSnapshot, runTransaction, serverTimestamp, query, where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let userBalance = 0;

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        onSnapshot(doc(db, "users", user.uid), (docSnap) => {
          if (docSnap.exists()) {
            userBalance = docSnap.data().balance || 0;
            document.getElementById('currentBalance').innerText = Number(userBalance).toLocaleString('bn-BD', { minimumFractionDigits: 2 });
          }
        });
        loadActiveSlots();
      } else {
        window.location.href = "login.html";
      }
    });

    function loadActiveSlots() {
      const q = query(collection(db, "slots"), where("status", "==", "active"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('slotsContainer');
        if (snapshot.empty) {
          container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 30px;">বর্তমানে কোনো লটারি স্লট চালু নেই।</div>`;
          return;
        }

        let html = '';
        snapshot.forEach((docSnap) => {
          const slot = docSnap.data();
          const slotId = docSnap.id;
          const joined = slot.joinedUsers || 0;
          const max = slot.maxUsers || 100;
          const fillPercent = Math.min((joined / max) * 100, 100);
          const isFull = joined >= max;

          const shortSlotCode = slotId.substring(0, 4).toUpperCase();

          html += `
            <div class="slot-card" style="margin-bottom: 15px;">
              <div class="slot-header">
                <div class="ticket-price">৳${slot.price} <span style="font-size: 12px; font-weight: normal; color: var(--text-muted);">/টিকিট</span></div>
                <div class="slot-limit">স্লট ID: #${shortSlotCode} (${joined}/${max})</div>
              </div>

              <div class="slot-info">
                <div><i class="fa-solid fa-trophy"></i> বিজয়ীর সংখ্যা: <strong>${slot.totalWinners} জন</strong></div>
                <div><i class="fa-solid fa-gift"></i> পুরস্কার: <strong>${slot.prizes}</strong></div>
              </div>

              <div class="progress-box">
                <div class="progress-text">
                  <span>বুকিং স্ট্যাটাস</span>
                  <span>${fillPercent.toFixed(0)}% পূর্ণ</span>
                </div>
                <div class="progress-bar-bg">
                  <div class="progress-bar-fill" style="width: ${fillPercent}%;"></div>
                </div>
              </div>

              <button class="btn-buy" ${isFull ? 'disabled' : ''} onclick="confirmBuyTicket('${slotId}', ${slot.price})">
                <i class="fa-solid fa-cart-shopping"></i> ${isFull ? 'স্লট ফুল হয়ে গেছে' : 'টিকিট কিনুন'}
              </button>
            </div>
          `;
        });
        container.innerHTML = html;
      });
    }

    window.confirmBuyTicket = async (slotId, price) => {
      if (!currentUser) return;

      if (userBalance < price) {
        Swal.fire({
          title: 'পর্যাপ্ত ব্যালেন্স নেই!',
          text: `টিকিট কেনার জন্য ৳${price} প্রয়োজন, আপনার বর্তমান ব্যালেন্স ৳${userBalance}। প্রথমে ডিপোজিট করুন।`,
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: '<i class="fa-solid fa-wallet"></i> ডিপোজিট করুন',
          cancelButtonText: 'পরে করব'
        }).then((result) => {
          if (result.isConfirmed) {
            window.location.href = "deposit.html";
          }
        });
        return;
      }

      const result = await Swal.fire({
        title: 'টিকিট নিশ্চিত করুন',
        text: `আপনি কি ৳${price} দিয়ে এই স্লটের ১টি টিকিট কিনতে চান?`,
        icon: 'question',
        showCancelButton: true,
        confirmButtonText: 'হ্যাঁ, কিনুন',
        cancelButtonText: 'বাতিল'
      });

      if (result.isConfirmed) {
        buyTicketTransaction(slotId, price);
      }
    };

    async function buyTicketTransaction(slotId, price) {
      Swal.fire({ title: 'প্রসেসিং হচ্ছে...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      const userRef = doc(db, "users", currentUser.uid);
      const slotRef = doc(db, "slots", slotId);
      const ticketRef = doc(collection(db, "tickets"));
      const trxRef = doc(collection(db, "transactions"));

      try {
        const shortSlotCode = slotId.substring(0, 4).toUpperCase();
        const randomTicketNum = `KS-${shortSlotCode}-${Math.floor(1000 + Math.random() * 9000)}`;

        await runTransaction(db, async (transaction) => {
          const userDoc = await transaction.get(userRef);
          const slotDoc = await transaction.get(slotRef);

          if (!userDoc.exists()) throw "ইউজার পাওয়া যায়নি!";
          if (!slotDoc.exists()) throw "লটারি স্লটটি বর্তমানে সক্রিয় নেই!";

          const currentBalance = userDoc.data().balance || 0;
          const slotData = slotDoc.data();
          const joinedUsers = slotData.joinedUsers || 0;

          if (slotData.status !== "active") {
            throw "এই স্লটে বর্তমানে টিকিট কেনা বন্ধ আছে!";
          }

          if (currentBalance < price) {
            throw "ইনসাফিসিয়েন্ট ব্যালেন্স!";
          }

          if (joinedUsers >= slotData.maxUsers) {
            throw "দুঃখিত, এই স্লটের সকল টিকিট বিক্রি হয়ে গেছে!";
          }

          if (slotData.drawTime) {
            const drawTimeMs =
              typeof slotData.drawTime === "number"
                ? slotData.drawTime
                : (
                    slotData.drawTime?.toDate
                      ? slotData.drawTime.toDate().getTime()
                      : new Date(slotData.drawTime).getTime()
                  );

            if (
              Number.isFinite(drawTimeMs) &&
              Date.now() >= drawTimeMs
            ) {
              throw "এই স্লটের ড্র শুরু হয়ে গেছে। এখন আর টিকিট কেনা যাবে না!";
            }
          }

          transaction.update(userRef, {
            balance: currentBalance - price,
            todayTickets: (userDoc.data().todayTickets || 0) + 1
          });

          transaction.update(slotRef, {
            joinedUsers: joinedUsers + 1
          });

          transaction.set(ticketRef, {
            ticketId: randomTicketNum,
            slotId: slotId,
            userId: currentUser.uid,
            userName: currentUser.displayName || 'ইউজার',
            price: price,
            status: 'active',
            createdAt: serverTimestamp()
          });

          transaction.set(trxRef, {
            userId: currentUser.uid,
            type: 'ticket',
            amount: price,
            ticketCode: randomTicketNum,
            status: 'approved',
            createdAt: serverTimestamp()
          });
        });

        Swal.fire({
          title: 'সফল!',
          text: `অভিনন্দন! আপনার ইউনিক টিকিট (${randomTicketNum}) সফলভাবে কেনা হয়েছে।`,
          icon: 'success',
          confirmButtonText: 'ঠিক আছে'
        });

      } catch (error) {
        console.error("Ticket purchase failed: ", error);
        Swal.fire('এরর', typeof error === 'string' ? error : 'টিকিট কিনতে সমস্যা হয়েছে। পুনরায় চেষ্টা করুন।', 'error');
      }
    }
  </script>
</body>
</html>
