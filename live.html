      --red: #ef4444;
    }

      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

      width: 100%;
      min-height: 100vh;
      background: var(--bg-color);
      color: #fff;
      overflow-x: hidden;

      flex-direction: column;

      padding: 16px;

       TOP BAR

      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.1);

    .back-btn:active {

    .page-title {

      font-weight: 800;
      color: var(--gold-light);
      letter-spacing: 0.5px;

       DISPLAY
    ========================= */

      background: linear-gradient(160deg, #101624, #080b12);
      border: 2px solid var(--border-color);

      padding: 22px;
      text-align: center;
      position: relative;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);

    }

    .slot-badge {

      align-items: center;

      color: var(--gold-light);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .timer-display {
      font-size: 30px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 14px;
      letter-spacing: 2px;
      text-shadow: 0 0 15px rgba(245, 158, 11, 0.3);
    }

    .draw-screen {

      border: 2px dashed rgba(245, 158, 11, 0.3);
      border-radius: 14px;
      padding: 10px;
      min-height: 160px;

      flex-direction: column;
      align-items: center;
      justify-content: center;

       PODIUM
    ========================= */

      justify-content: space-between;
      align-items: center;

      font-weight: 700;

    }

    /* =========================================================
       TIMESTAMP HELPER
    ========================================================= */


    function getTimestampMillis(value) {

      if (!value) {
        return 0;
      }


      try {

        if (
          typeof value.toMillis ===
          "function"
        ) {

          return value.toMillis();

        }


        if (
          typeof value.toDate ===
          "function"
        ) {

          return value
            .toDate()
            .getTime();

        }


        if (
          typeof value ===
          "number"
        ) {

          if (
            value < 100000000000
          ) {

            return value * 1000;

          }

          return value;

        }


        if (
          typeof value ===
          "string"
        ) {

          const parsed =
            Date.parse(value);

          return Number.isNaN(parsed)
            ? 0
            : parsed;

        }


        if (
          value.seconds !==
          undefined
        ) {

          return (
            Number(value.seconds) *
              1000
            +
            Math.floor(
              Number(
                value.nanoseconds ||
                0
              ) / 1000000
            )
          );

        }

      } catch (error) {

        console.error(
          "Timestamp error:",
          error
        );

      }


      return 0;

    }



    /* =========================================================
       CLOCK

       Firestore-এর drawTime কেন্দ্রীয় সময়।

       Browser clock সামান্য ভুল হলেও এখানে
       browser থেকে server offset পাওয়া গেলে
       সেটি ব্যবহার করা হবে।

       offset না থাকলে একই Firestore timestamp
       সব ডিভাইসে ব্যবহার হবে।
    ========================================================= */


    function getNow() {

      return (
        Date.now() +
        serverTimeOffset
      );

    }



    /* =========================================================
       ESCAPE HTML
    ========================================================= */


    function escapeHtml(value) {

      const text =
        String(
          value === null ||
          value === undefined
            ? ""
            : value
        );


      const map = {

        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"

      };


      return text.replace(
        /[&<>"']/g,
        char =>
          map[char]
      );

    }

        myHistoryPane
          .classList
          .add("active");

        liveChatPane
          .classList
          .remove("active");

        loadUserHistory();

      }
    );



    /* =========================================================
       LIVE DRAW LISTENER

       সবচেয়ে গুরুত্বপূর্ণ অংশ।

       আর কোনো Cloud Function নেই।

       সবাই একই document:
       live_draw/current
       শুনবে।
    ========================================================= */


    function listenForLiveDraw() {

      if (liveDrawUnsubscribe) {

        liveDrawUnsubscribe();

      }


      liveDrawUnsubscribe =
        onSnapshot(

          liveDrawRef,

          snapshot => {

            if (!snapshot.exists()) {

              resetDisplay(
                "বর্তমানে কোনো ড্র চালু নেই"
              );

              return;

            }


            const data =
              snapshot.data() || {};


            currentDrawData = data;


            processLiveDraw(
              data
            );

          },


          error => {

            console.error(
              "Live draw listener error:",
              error
            );


            resetDisplay(
              "লাইভ ড্র তথ্য লোড করা যাচ্ছে না"
            );

          }

        );

    }



    /* =========================================================
       PROCESS CENTRAL DRAW
    ========================================================= */


    function processLiveDraw(data) {

      const slotCode =
        data.slotCode ||
        data.slotName ||
        data.slotId ||
        "N/A";


      const status =
        String(
          data.status ||
          "countdown"
        ).toLowerCase();


      const drawTime =
        getTimestampMillis(
          data.drawTime ||
          data.scheduledDrawTime ||
          data.drawAt
        );


      const winners =
        Array.isArray(
          data.winnersList
        )
          ? data.winnersList
          : (
              Array.isArray(
                data.winners
              )
                ? data.winners
                : []
            );



      slotBadge.innerHTML =
        `
          <i class="fa-solid fa-ticket"></i>

          স্লট ID:
          #${escapeHtml(slotCode)}
        `;



      /*
        RESULT EXISTS
      */

      if (
        winners.length > 0 &&
        (
          status === "completed" ||
          status === "complete" ||
          status === "finished" ||
          status === "drawn" ||
          data.resultReady === true
        )
      ) {

        clearCountdown();

        showResult(
          winners,
          slotCode,
          data
        );

        return;

      }



      /*
        RESULT EXISTS কিন্তু status field
        দেওয়া হয়নি।
      */

      if (
        winners.length > 0 &&
        drawTime > 0 &&
        getNow() >= drawTime
      ) {

        clearCountdown();

        showResult(
          winners,
          slotCode,
          data
        );

        return;

      }



      /*
        DRAW TIME নেই
      */

      if (drawTime <= 0) {

        clearCountdown();

        timerDisplay.innerText =
          "--:--";


        spinnerContainer.innerHTML =
          `
            <div class="spinner-item">

              <i class="fa-solid fa-clock"></i>

              ড্রয়ের সময় নির্ধারণ করা হচ্ছে...

            </div>
          `;


        winnerStatusText.innerText =
          "ড্রয়ের সময় নির্ধারণ করা হয়নি";

        return;

      }



      /*
        COUNTDOWN
      */

      startCountdown(
        drawTime,
        slotCode
      );

    }



    /* =========================================================
       COUNTDOWN
    ========================================================= */


    function startCountdown(
      targetTime,
      slotCode
    ) {

      clearCountdown();


      function update() {

        const diff =
          targetTime -
          getNow();


        /*
          সময় শেষ
        */

        if (diff <= 0) {

          clearCountdown();


          timerDisplay.innerText =
            "00:00";


          spinnerContainer.innerHTML =
            `
              <div class="spinner-item">

                <i class="fa-solid fa-spinner fa-spin"></i>

                ফলাফল প্রকাশের অপেক্ষায়...

              </div>
            `;


          winnerStatusText.innerText =
            `
              স্লট #${escapeHtml(slotCode)}
              — ড্র সম্পন্ন হয়েছে
            `;


          /*
            এখানে কোনো random draw করা হবে না।

            Admin Firestore-এ winnersList দিলেই
            onSnapshot নিজে থেকেই result দেখাবে।
          */

          return;

        }



        const totalSeconds =
          Math.floor(
            diff / 1000
          );


        const hours =
          Math.floor(
            totalSeconds / 3600
          );


        const minutes =
          Math.floor(
            (
              totalSeconds % 3600
            ) / 60
          );


        const seconds =
          totalSeconds % 60;


        let text = "";


        if (hours > 0) {

          text =
            String(hours)
              .padStart(2, "0")
            +
            ":"
            +
            String(minutes)
              .padStart(2, "0")
            +
            ":"
            +
            String(seconds)
              .padStart(2, "0");

        } else {

          text =
            String(minutes)
              .padStart(2, "0")
            +
            ":"
            +
            String(seconds)
              .padStart(2, "0");

        }


        timerDisplay.innerText =
          text;


        winnerStatusText.innerText =
          `
            স্লট #${escapeHtml(slotCode)}
            — কাউন্টডাউন চলছে...
          `;


        spinnerContainer.innerHTML =
          `
            <div class="spinner-item">

              <i class="fa-solid fa-ticket"></i>

              বিজয়ী নির্বাচন হবে
              ${text}
              পরে

            </div>
          `;

      }


      update();


      countdownInterval =
        setInterval(
          update,
          250
        );

    }



    /* =========================================================
       CLEAR COUNTDOWN
    ========================================================= */


    function clearCountdown() {

      if (
        countdownInterval
      ) {

        clearInterval(
          countdownInterval
        );

        countdownInterval = null;

      }

    }



    /* =========================================================
       SHOW RESULT

       Firestore-এ যে result রাখা আছে
       ঠিক সেটাই দেখাবে।

       Client নিজে winner তৈরি করবে না।
    ========================================================= */


    function showResult(
      winners,
      slotCode,
      data
    ) {

      clearCountdown();


      timerDisplay.innerText =
        "সম্পন্ন";


      winnerStatusText.innerHTML =
        `
          স্লট #${escapeHtml(slotCode)}
          এর ড্র সম্পন্ন হয়েছে
        `;



      spinnerContainer.innerHTML =
        winners
          .map(
            (winner, index) =>
              createPodiumItem(
                winner,
                index
              )
          )
          .join("");


      if (!winners.length) {

        spinnerContainer.innerHTML =
          `
            <div class="spinner-item">
              ফলাফল পাওয়া যায়নি
            </div>
          `;

        return;

      }



      /*
        একই result আবার snapshot এ এলে
        popup বারবার দেখাবে না।
      */

      const resultKey =
        JSON.stringify(
          winners
        );


      if (
        resultKey ===
        lastResultKey
      ) {

        return;

      }


      lastResultKey =
        resultKey;


      const topWinner =
        winners[0] || {};


      const topName =
        topWinner.name ||
        topWinner.userName ||
        "N/A";


      const topNumber =
        topWinner.number ||
        topWinner.ticketNumber ||
        topWinner.ticketId ||
        "N/A";



      congratsText.innerHTML =
        `
          স্লট ID:
          <b>#${escapeHtml(slotCode)}</b>

          <br>

          ১ম বিজয়ী:
          <b>${escapeHtml(topName)}</b>

          <br>

          টিকিট:
          <b>${escapeHtml(topNumber)}</b>

          <br>

          ফলাফল সফলভাবে প্রকাশিত হয়েছে!
        `;



      congratsBanner
        .classList
        .add("active");


      playSound();



      setTimeout(
        () => {

          congratsBanner
            .classList
            .remove("active");

        },
        4500
      );



      /*
        Result update হওয়ার পর history refresh
      */

      loadUserHistory();

    }



    /* =========================================================
       PODIUM
    ========================================================= */


    function createPodiumItem(
      winner,
      index
    ) {

      const rankClass =
        index === 0
          ? "podium-1"
          : (
              index === 1
                ? "podium-2"
                : "podium-3"
            );


      const medalIcon =
        index === 0
          ? "fa-trophy"
          : (
              index === 1
                ? "fa-medal"
                : "fa-award"
            );


      const rank =
        winner?.rank ||
        winner?.position ||
        `${index + 1}ম`;


      const number =
        winner?.number ||
        winner?.ticketNumber ||
        winner?.ticketId ||
        "N/A";


      const name =
        winner?.name ||
        winner?.userName ||
        "ইউজার";


      return `
        <div
          class="podium-item ${rankClass}"
          style="animation-delay:${index * 0.2}s;">

          <span>

            <i class="fa-solid ${medalIcon}"></i>

            ${escapeHtml(rank)}

          </span>


          <span>

            ${escapeHtml(number)}

          </span>


          <span>

            ${escapeHtml(name)}

          </span>

        </div>
      `;

    }



    /* =========================================================
       RESET DISPLAY
    ========================================================= */


    function resetDisplay(
      message
    ) {

      clearCountdown();


      slotBadge.innerHTML =
        `
          <i class="fa-solid fa-clock"></i>

          ড্রয়ের অপেক্ষা
        `;


      timerDisplay.innerText =
        "--:--";


      spinnerContainer.innerHTML =
        `
          <div class="spinner-item">

            ---

          </div>
        `;


      winnerStatusText.innerText =
        message ||
        "বর্তমানে কোনো ড্র লাইভ নেই";


      currentDrawData =
        null;


      lastResultKey =
        "";

    }



    /* =========================================================
       SOUND
    ========================================================= */


    function playSound() {

      try {

        cheerAudio.currentTime =
          0;


        const promise =
          cheerAudio.play();


        if (
          promise &&
          typeof promise.catch ===
          "function"
        ) {

          promise.catch(
            () => {}
          );

        }

      } catch (error) {}

    }



    /* =========================================================
       USER HISTORY
    ========================================================= */


    async function loadUserHistory() {

      if (historyLoading) {
        return;
      }


      if (!currentUserId) {

        historyContentList.innerHTML =
          `
            <div class="loading-text">
              লগইন করা নেই
            </div>
          `;

        return;

      }


      historyLoading = true;


      historyContentList.innerHTML =
        `
          <div class="loading-text">
            তথ্য খোঁজা হচ্ছে...
          </div>
        `;


      try {

        const ticketQuery =
          query(
            collection(
              db,
              "tickets"
            ),
            where(
              "userId",
              "==",
              currentUserId
            )
          );


        const ticketSnap =
          await getDocs(
            ticketQuery
          );


        if (
          ticketSnap.empty
        ) {

          historyContentList.innerHTML =
            `
              <div class="loading-text">
                আপনার কোনো টিকিট নেই
              </div>
            `;

          return;

        }


        let ticketsData = [];


        ticketSnap.forEach(
          ticketDoc => {

            ticketsData.push({
              id:
                ticketDoc.id,
              ...ticketDoc.data()
            });

          }
        );


        ticketsData.sort(
          (a, b) => {

            return (
              getTimestampMillis(
                b.createdAt
              )
              -
              getTimestampMillis(
                a.createdAt
              )
            );

          }
        );


        ticketsData =
          ticketsData.slice(
            0,
            10
          );


        let winCount = 0;

        let html = "";


        /*
          Central result-এর winner list
          দিয়ে winner check করা হবে।

          এতে ticket status update দেরি করলেও
          result page সঠিক winner দেখাতে পারবে।
        */

        let centralWinners = [];


        if (
          currentDrawData &&
          Array.isArray(
            currentDrawData.winnersList
          )
        ) {

          centralWinners =
            currentDrawData.winnersList;

        }


        for (
          const ticket of ticketsData
        ) {


          const ticketNo =
            ticket.ticketId ||
            ticket.ticketNumber ||
            ticket.number ||
            "N/A";


          const ticketString =
            String(ticketNo);


          const isCentralWinner =
            centralWinners.some(
              winner => {

                const winnerNo =
                  winner?.number ||
                  winner?.ticketNumber ||
                  winner?.ticketId ||
                  "";


                return (
                  String(winnerNo) ===
                  ticketString
                );

              }
            );


          const ticketStatus =
            String(
              ticket.status || ""
            ).toLowerCase();


          const isWin =
            isCentralWinner ||
            ticketStatus === "won" ||
            ticketStatus === "win" ||
            ticket.isWinner === true;


          const isLoss =
            ticketStatus === "lost";


          if (isWin) {
            winCount++;
          }


          const shortSlot =
            ticket.slotId
              ? String(
                  ticket.slotId
                )
                  .substring(
                    0,
                    6
                  )
                  .toUpperCase()
              : "N/A";


          let timeFormatted = "";


          const createdMillis =
            getTimestampMillis(
              ticket.createdAt
            );


          if (
            createdMillis > 0
          ) {

            const dateObj =
              new Date(
                createdMillis
              );


            timeFormatted =
              dateObj.toLocaleDateString(
                "bn-BD",
                {
                  day: "numeric",
                  month: "short",
                  year: "numeric"
                }
              )
              +
              " "
              +
              dateObj.toLocaleTimeString(
                "bn-BD",
                {
                  hour: "2-digit",
                  minute: "2-digit"
                }
              );

          }


          let statusHtml =
            "";


          let cardClass =
            "";


          if (isWin) {

            cardClass =
              "win-card";


            statusHtml =
              `
                <span class="history-val win">

                  <i class="fa-solid fa-trophy"></i>

                  বিজয়ী! 🎉

                </span>
              `;

          } else if (isLoss) {

            cardClass =
              "loss-card";


            statusHtml =
              `
                <span class="history-val loss">

                  <i class="fa-solid fa-xmark"></i>

                  বিজয়ী হননি

                </span>
              `;

          } else {

            statusHtml =
              `
                <span
                  style="color:var(--gold-light);">

                  <i class="fa-solid fa-hourglass-half"></i>

                  ড্র অপেক্ষমাণ

                </span>
              `;

          }



          html += `
            <div
              class="history-card ${cardClass}">

              <div class="history-row">

                <span class="history-label">
                  স্লট আইডি
                </span>

                <span
                  class="history-val badge-code">

                  #${escapeHtml(shortSlot)}

                </span>

              </div>


              <div class="history-row">

                <span class="history-label">
                  টিকিট নম্বর
                </span>

                <span class="history-val">

                  ${escapeHtml(ticketNo)}

                </span>

              </div>


              <div class="history-row">

                <span class="history-label">
                  ফলাফল
                </span>

                ${statusHtml}

              </div>


              ${
                timeFormatted
                  ? `
                    <div class="history-time">

                      <i class="fa-regular fa-clock"></i>

                      ${escapeHtml(
                        timeFormatted
                      )}

                    </div>
                  `
                  : ""
              }

            </div>
          `;

        }



        historyContentList.innerHTML =
          `

            <div style="
              background:rgba(245,158,11,0.1);
              border:1px solid var(--border-color);
              border-radius:10px;
              padding:8px 12px;
              margin-bottom:6px;
              text-align:center;
              font-size:13px;
              font-weight:700;
              color:var(--gold-light);
            ">

              সর্বশেষ:
              ${ticketsData.length}
              টি টিকিট

              |

              মোট উইন:
              ${winCount}
              বার

            </div>

            ${html}

          `;


      } catch (error) {

        console.error(
          "History error:",
          error
        );


        historyContentList.innerHTML =
          `
            <div style="
              text-align:center;
              color:#ef4444;
              margin-top:40px;
            ">

              হিস্ট্রি লোড করতে সমস্যা হয়েছে

            </div>
          `;

      } finally {

        historyLoading =
          false;

      }

    }



    /* =========================================================
       CHAT SEND
    ========================================================= */


    async function sendChatMessage() {

      const msg =
        chatInput.value.trim();


      if (!msg) {
        return;
      }


      if (!auth.currentUser) {

        if (
          typeof Swal !==
          "undefined"
        ) {

          Swal.fire({

            icon:
              "warning",

            title:
              "লগইন করুন",

            text:
              "চ্যাট করতে আগে লগইন করুন",

            confirmButtonText:
              "ঠিক আছে"

          });

        }

        return;

      }


      const sendButton =
        document.getElementById(
          "sendChatBtn"
        );


      if (
        sendButton.disabled
      ) {

        return;

      }


      sendButton.disabled =
        true;


      try {

        const userDoc =
          await getDoc(
            doc(
              db,
              "users",
              auth.currentUser.uid
            )
          );


        const userData =
          userDoc.exists()
            ? userDoc.data()
            : {};


        await addDoc(
          collection(
            db,
            "live_chats"
          ),
          {

            userId:
              auth.currentUser.uid,

            name:
              userData.name ||
              userData.displayName ||
              "ইউজার",

            photo:
              userData.photoUrl ||
              userData.photo ||
              "https://cdn-icons-png.flaticon.com/512/149/149071.png",

            message:
              msg.substring(
                0,
                300
              ),

            createdAt:
              serverTimestamp()

          }
        );


        chatInput.value =
          "";

      } catch (error) {

        console.error(
          "Chat send error:",
          error
        );


        if (
          typeof Swal !==
          "undefined"
        ) {

          Swal.fire({

            icon:
              "error",

            title:
              "সমস্যা হয়েছে",

            text:
              "মেসেজ পাঠানো যায়নি",

            confirmButtonText:
              "ঠিক আছে"

          });

        }

      } finally {

        sendButton.disabled =
          false;

      }

    }



    document
      .getElementById(
        "sendChatBtn"
      )
      .addEventListener(
        "click",
        sendChatMessage
      );



    chatInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key ===
            "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendChatMessage();

        }

      }
    );



    /* =========================================================
       CHAT LISTENER
    ========================================================= */


    function listenForChat() {

      if (chatUnsubscribe) {

        chatUnsubscribe();

      }


      const chatQuery =
        query(
          collection(
            db,
            "live_chats"
          ),
          orderBy(
            "createdAt",
            "asc"
          )
        );


      chatUnsubscribe =
        onSnapshot(

          chatQuery,

          snapshot => {

            let html = "";


            snapshot.forEach(
              chatDoc => {

                const chat =
                  chatDoc.data() ||
                  {};


                const photo =
                  chat.photo ||
                  "https://cdn-icons-png.flaticon.com/512/149/149071.png";


                html += `

                  <div
                    class="chat-bubble">

                    <img
                      src="${escapeHtml(photo)}"
                      class="chat-avatar"
                      alt="avatar"
                      onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png';">


                    <div
                      class="chat-content-box">

                      <div
                        class="chat-username">

                        ${escapeHtml(
                          chat.name ||
                          "ইউজার"
                        )}

                      </div>


                      <div
                        class="chat-text">

                        ${escapeHtml(
                          chat.message ||
                          ""
                        )}

                      </div>

                    </div>

                  </div>

                `;

              }
            );


            if (!html) {

              html =
                `
                  <div
                    class="loading-text">

                    এখনো কোনো মন্তব্য নেই

                  </div>
                `;

            }


            chatContainer.innerHTML =
              html;


            chatContainer.scrollTop =
              chatContainer.scrollHeight;

          },


          error => {

            console.error(
              "Chat snapshot error:",
              error
            );


            chatContainer.innerHTML =
              `
                <div
                  class="loading-text">

                  চ্যাট লোড করা যাচ্ছে না

                </div>
              `;

          }

        );

    }



    /* =========================================================
       START
    ========================================================= */


    function startPage() {

      listenForLiveDraw();

      listenForChat();

    }



    if (
      document.readyState ===
      "loading"
    ) {

      document.addEventListener(
        "DOMContentLoaded",
        startPage,
        {
          once: true
        }
      );

    } else {

      startPage();

    }



    /* =========================================================
       CLEANUP
    ========================================================= */


    window.addEventListener(
      "beforeunload",
      () => {

        clearCountdown();


        if (
          liveDrawUnsubscribe
        ) {

          liveDrawUnsubscribe();

        }


        if (
          chatUnsubscribe
        ) {

          chatUnsubscribe();

        }

      }
    );

  </script>
