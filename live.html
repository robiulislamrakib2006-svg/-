<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>লাইভ ড্র ও রেজাল্ট - কোপা সামসু লটারি</title>

  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #07090f;
      --card-bg: rgba(15, 20, 32, 0.95);
      --gold: #f59e0b;
      --gold-light: #fbbf24;
      --gold-gradient: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      --text-muted: #94a3b8;
      --border-color: rgba(245, 158, 11, 0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Hind Siliguri', sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; min-height: 100vh; background: var(--bg-color); color: #fff; overflow-x: hidden; }
    body { display: flex; flex-direction: column; align-items: center; padding: 16px; }

    .main-wrapper { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 16px; flex: 1; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-bg); backdrop-filter: blur(15px);
      border: 1px solid var(--border-color); border-radius: 16px; padding: 12px 18px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }
    .back-btn { color: #fff; font-size: 16px; text-decoration: none; display: flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.2s; }
    .page-title { font-size: 17px; font-weight: 800; color: var(--gold-light); letter-spacing: 0.5px; }

    .display-box {
      background: linear-gradient(160deg, #101624, #080b12);
      border: 2px solid var(--border-color); border-radius: 20px; padding: 22px;
      text-align: center; position: relative; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6); overflow: hidden;
    }

    .slot-badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(245, 158, 11, 0.12); color: var(--gold-light);
      padding: 6px 16px; border-radius: 20px; font-size: 13px; font-weight: 700; margin-bottom: 12px;
      border: 1px solid rgba(245, 158, 11, 0.3); text-align: center;
    }

    .timer-display { font-size: 30px; font-weight: 800; color: #fff; margin-bottom: 14px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }

    .draw-screen {
      background: rgba(0, 0, 0, 0.6); border: 2px dashed rgba(245, 158, 11, 0.3);
      border-radius: 14px; padding: 10px; height: 160px;
      position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    }

    /* Podium Card Styles for Top 3 Winners */
    .podium-item {
      width: 100%;
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 700;
      animation: popIn 0.4s ease forwards;
      opacity: 0;
      transform: translateY(15px);
    }
    @keyframes popIn {
      to { opacity: 1; transform: translateY(0); }
    }

    .podium-1 {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.3), rgba(217, 119, 6, 0.2));
      border: 2px solid #f59e0b;
      color: #fbbf24;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
    }
    .podium-2 {
      background: linear-gradient(135deg, rgba(148, 163, 184, 0.3), rgba(100, 116, 139, 0.2));
      border: 2px solid #cbd5e1;
      color: #e2e8f0;
      box-shadow: 0 0 12px rgba(203, 213, 225, 0.3);
    }
    .podium-3 {
      background: linear-gradient(135deg, rgba(217, 119, 6, 0.25), rgba(146, 64, 14, 0.2));
      border: 2px solid #d97706;
      color: #fcd34d;
      box-shadow: 0 0 10px rgba(217, 119, 6, 0.3);
    }

    .spinner-container {
      position: absolute; width: 100%; display: flex; flex-direction: column; align-items: center;
      top: 0; will-change: transform;
    }

    .spinner-item {
      height: 44px; display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; color: var(--text-muted); width: 100%; opacity: 0.35;
    }

    .winner-status { font-size: 13px; color: #34d399; font-weight: 700; margin-top: 14px; min-height: 22px; }

    .congrats-banner {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(7, 9, 15, 0.96); display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; z-index: 10;
      opacity: 0; pointer-events: none; transform: scale(0.95); transition: all 0.3s ease;
    }
    .congrats-banner.active { opacity: 1; pointer-events: auto; transform: scale(1); }

    .popup-card {
      background: linear-gradient(145deg, #171f33, #0d121f);
      border: 2px solid var(--gold); border-radius: 18px; padding: 22px; width: 85%; max-width: 320px; text-align: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.8);
    }
    .popup-card i { font-size: 45px; color: var(--gold); margin-bottom: 8px; filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5)); }
    .popup-card h2 { color: var(--gold-light); font-size: 20px; font-weight: 800; margin-bottom: 6px; }
    .popup-card p { font-size: 13px; color: #cbd5e1; line-height: 1.5; }

    .switch-section {
      background: var(--card-bg); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px; padding: 14px; display: flex; flex-direction: column; height: 320px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }
    .tab-headers {
      display: flex; gap: 10px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 8px;
    }
    .tab-btn {
      flex: 1; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px; padding: 8px; color: var(--text-muted); font-size: 13px; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
    }
    .tab-btn.active {
      background: var(--gold-gradient); color: #000; border-color: var(--gold); box-shadow: 0 4px 15px rgba(245,158,11,0.3);
    }

    .tab-pane { display: none; flex: 1; flex-direction: column; height: 100%; overflow: hidden; }
    .tab-pane.active { display: flex; }

    .chat-messages { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; margin-bottom: 8px; }
    .chat-bubble { display: flex; align-items: flex-start; gap: 8px; font-size: 12px; }
    .chat-avatar { width: 26px; height: 26px; border-radius: 50%; background: #222; object-fit: cover; border: 1px solid var(--gold); flex-shrink: 0; }
    .chat-content-box { background: rgba(255, 255, 255, 0.04); padding: 6px 10px; border-radius: 10px; max-width: 82%; border: 1px solid rgba(255,255,255,0.03); }
    .chat-username { font-size: 10px; color: var(--gold-light); font-weight: 700; margin-bottom: 2px; }
    .chat-text { color: #e2e8f0; word-break: break-all; }
    .chat-input-box { display: flex; gap: 8px; }
    .chat-input { flex: 1; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; padding: 8px 12px; color: #fff; font-size: 12px; outline: none; }
    .send-btn { background: var(--gold-gradient); color: #000; border: none; border-radius: 10px; padding: 0 14px; font-weight: 700; cursor: pointer; }

    .history-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .history-card {
      background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px;
    }
    .history-card.win-card { border-color: rgba(52, 211, 153, 0.5); background: rgba(52, 211, 153, 0.08); }
    .history-card.loss-card { border-color: rgba(239, 68, 68, 0.2); background: rgba(239, 68, 68, 0.03); }
    .history-row { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .history-label { color: var(--text-muted); }
    .history-val { font-weight: 700; color: #fff; }
    .history-val.win { color: #34d399; }
    .history-val.loss { color: #ef4444; }
    .history-val.badge-code { color: var(--gold-light); background: rgba(245,158,11,0.1); padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(245,158,11,0.2); }
    .history-time { font-size: 10px; color: var(--text-muted); text-align: right; margin-top: 2px; }
  </style>
</head>
<body>

  <audio id="cheerAudio" src="https://assets.mixkit.co/active_storage/sfx/2018/2018-preview.mp3" preload="auto"></audio>

  <div class="main-wrapper">
    <div class="top-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <div class="page-title">লাইভ ড্র ও রেজাল্ট</div>
      <div style="width: 36px;"></div>
    </div>

    <div class="display-box" id="displayBox">
      <div class="congrats-banner" id="congratsBanner">
        <div class="popup-card">
          <i class="fa-solid fa-trophy"></i>
          <h2>অভিনন্দন! 🎉</h2>
          <p id="congratsText">বিজয়ীর নাম লোড হচ্ছে...</p>
        </div>
      </div>

      <div class="slot-badge" id="slotNameBadge"><i class="fa-solid fa-circle-notch fa-spin"></i> স্লটের তথ্য খোঁজা হচ্ছে...</div>
      <div class="timer-display" id="timerDisplay">--:--</div>

      <div class="draw-screen" id="drawScreen">
        <div class="spinner-container" id="spinnerContainer">
          <div class="spinner-item">অপেক্ষা করুন</div>
        </div>
      </div>
      
      <div class="winner-status" id="winnerStatusText">বর্তমানে কোনো ড্র লাইভ নেই</div>
    </div>

    <div class="switch-section">
      <div class="tab-headers">
        <button class="tab-btn active" id="liveChatTabBtn"><i class="fa-solid fa-comments"></i> লাইভ চ্যাট</button>
        <button class="tab-btn" id="myHistoryTabBtn"><i class="fa-solid fa-clock-rotate-left"></i> মাই হিস্ট্রি</button>
      </div>

      <div class="tab-pane active" id="liveChatPane">
        <div class="chat-messages" id="chatMessagesContainer"></div>
        <div class="chat-input-box">
          <input type="text" id="chatInput" class="chat-input" placeholder="আপনার মন্তব্য লিখুন...">
          <button id="sendChatBtn" class="send-btn"><i class="fa-solid fa-paper-plane"></i></button>
        </div>
      </div>

      <div class="tab-pane" id="myHistoryPane">
        <div class="history-content" id="historyContentList">
          <div style="text-align: center; color: var(--text-muted); margin-top: 40px;">হিস্ট্রি লোড হচ্ছে...</div>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, doc, getDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, getDocs, where 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getFunctions, httpsCallable } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-functions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const functions = getFunctions(app);

    let currentUserId = null;
    let currentActiveSlotId = null;
    let isRunningDraw = false;

    const slotBadge = document.getElementById('slotNameBadge');
    const timerDisplay = document.getElementById('timerDisplay');
    const spinnerContainer = document.getElementById('spinnerContainer');
    const winnerStatusText = document.getElementById('winnerStatusText');
    const congratsBanner = document.getElementById('congratsBanner');
    const congratsText = document.getElementById('congratsText');
    const cheerAudio = document.getElementById('cheerAudio');

    const liveChatTabBtn = document.getElementById('liveChatTabBtn');
    const myHistoryTabBtn = document.getElementById('myHistoryTabBtn');
    const liveChatPane = document.getElementById('liveChatPane');
    const myHistoryPane = document.getElementById('myHistoryPane');
    const historyContentList = document.getElementById('historyContentList');

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        loadUserHistory();
      }
    });

    liveChatTabBtn.addEventListener('click', () => {
      liveChatTabBtn.classList.add('active');
      myHistoryTabBtn.classList.remove('active');
      liveChatPane.classList.add('active');
      myHistoryPane.classList.remove('active');
    });

    myHistoryTabBtn.addEventListener('click', () => {
      myHistoryTabBtn.classList.add('active');
      liveChatTabBtn.classList.remove('active');
      myHistoryPane.classList.add('active');
      liveChatPane.classList.remove('active');
      loadUserHistory();
    });

    async function loadUserHistory() {
      if (!currentUserId) {
        historyContentList.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px;">লগইন করা নেই</div>`;
        return;
      }

      historyContentList.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px;">তথ্য খোঁজা হচ্ছে...</div>`;

      try {
        const ticketSnap = await getDocs(query(collection(db, "tickets"), where("userId", "==", currentUserId)));

        if (ticketSnap.empty) {
          historyContentList.innerHTML = `<div style="text-align: center; color: var(--text-muted); margin-top: 40px;">আপনার কোনো টিকিট কেনা বা ড্র হিস্ট্রি নেই</div>`;
          return;
        }

        let ticketsData = [];
        ticketSnap.forEach(docSnap => {
          ticketsData.push({ id: docSnap.id, ...docSnap.data() });
        });

        ticketsData.sort((a, b) => {
          const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return timeB - timeA;
        });

        ticketsData = ticketsData.slice(0, 5);

        let slotsMap = {};
        const slotsSnap = await getDocs(collection(db, "slots"));
        slotsSnap.forEach(sDoc => {
          slotsMap[sDoc.id] = sDoc.data().status;
        });

        let winCount = 0;
        let html = '';

        for (let t of ticketsData) {
          const shortSlot = t.slotId ? t.slotId.substring(0, 6).toUpperCase() : 'N/A';
          const ticketNo = t.ticketId || t.ticketNumber || t.number || 'N/A';
          
          const isWin = t.status === "won" || t.status === "win" || t.isWinner === true;
          const rankText = t.winRank || t.rank || (isWin ? '১ম' : '');
          const slotStatus = t.slotId ? slotsMap[t.slotId] : 'completed';

          if (isWin) winCount++;
          
          let timeFormatted = '';
          if (t.createdAt && t.createdAt.toDate) {
            const dateObj = t.createdAt.toDate();
            timeFormatted = dateObj.toLocaleDateString('bn-BD', { day: 'numeric', month: 'short', year: 'numeric' }) + ' ' + dateObj.toLocaleTimeString('bn-BD', { hour: '2-digit', minute: '2-digit' });
          }

          let statusHtml = '';
          let cardClass = '';

          if (isWin) {
            cardClass = 'win-card';
            statusHtml = `<span class="history-val win"><i class="fa-solid fa-trophy"></i> ${rankText} বিজয়ী! 🎉</span>`;
          } else if (slotStatus === 'completed' || t.status === 'lost') {
            cardClass = 'loss-card';
            statusHtml = `<span class="history-val loss"><i class="fa-solid fa-xmark"></i> বিজয়ী হননি</span>`;
          } else {
            statusHtml = `<span style="color:var(--gold-light);"><i class="fa-solid fa-hourglass-half"></i> ড্র অপেক্ষমাণ</span>`;
          }

          html += `
            <div class="history-card ${cardClass}">
              <div class="history-row">
                <span class="history-label">স্লট আইডি</span>
                <span class="history-val badge-code">#${shortSlot}</span>
              </div>
              <div class="history-row">
                <span class="history-label">টিকিট নম্বর</span>
                <span class="history-val">${escapeHtml(ticketNo)}</span>
              </div>
              <div class="history-row">
                <span class="history-label">ফলাফল</span>
                ${statusHtml}
              </div>
              ${timeFormatted ? `<div class="history-time"><i class="fa-regular fa-clock"></i> ${timeFormatted}</div>` : ''}
            </div>
          `;
        }

        historyContentList.innerHTML = `
          <div style="background: rgba(245,158,11,0.1); border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; text-align: center; font-size: 13px; font-weight: 700; color: var(--gold-light);">
            সর্বশেষ : ${ticketsData.length} টি টিকিট | মোট উইন: ${winCount} বার
          </div>
          ${html}
        `;

      } catch (err) {
        historyContentList.innerHTML = `<div style="text-align: center; color: #ef4444; margin-top: 40px;">হিস্ট্রি লোড করতে সমস্যা হয়েছে</div>`;
      }
    }

    function playSound() {
      try {
        cheerAudio.currentTime = 0;
        cheerAudio.play().catch(() => {});
      } catch (e) {}
    }

    function escapeHtml(text) {
      const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
      return text.replace(/[&<>"']/g, m => map[m]);
    }

    function listenForLiveSlots() {
      onSnapshot(collection(db, "slots"), async (snapshot) => {
        if (snapshot.empty) {
          resetDisplayToDefault("বর্তমানে কোনো স্লট বা ড্র নেই");
          return;
        }

        let activeSlotDoc = null;
        snapshot.forEach(docSnap => {
          const slotData = docSnap.data();
          if (slotData.status === "countdown" || slotData.status === "live" || slotData.status === "drawing") {
            activeSlotDoc = { id: docSnap.id, ...slotData };
          }
        });

        if (!activeSlotDoc) {
          resetDisplayToDefault("বর্তমানে কোনো ড্র লাইভ নেই");
          return;
        }

        if (isRunningDraw && currentActiveSlotId === activeSlotDoc.id) return;

        currentActiveSlotId = activeSlotDoc.id;
        const shortSlotCode = currentActiveSlotId.substring(0, 4).toUpperCase();
        slotBadge.innerHTML = `<i class="fa-solid fa-ticket"></i> স্লট ID: #${shortSlotCode}`;

        const bookingSnap = await getDocs(query(collection(db, "tickets"), where("slotId", "==", activeSlotDoc.id)));
        let participants = [];
        bookingSnap.forEach(bDoc => {
          const bData = bDoc.data();
          participants.push({
            docId: bDoc.id,
            userId: bData.userId || "",
            name: bData.userName || "ইউজার",
            number: bData.ticketId || bData.ticketNumber || "KS-101",
            prize: activeSlotDoc.prizes || "৳৫০০"
          });
        });

        if (participants.length === 0) {
          timerDisplay.innerText = "00:00";
          spinnerContainer.innerHTML = `<div class="spinner-item">এই স্লটে কেউ টিকিট কেনেনি</div>`;
          winnerStatusText.innerText = `স্লট #${shortSlotCode}: প্রতিযোগী নেই`;
          isRunningDraw = false;
          return;
        }

        const currentWinners = activeSlotDoc.winnersList || [];

        if (currentWinners.length > 0 || activeSlotDoc.status === 'completed') {
          showExistingWinners(currentWinners, shortSlotCode);
        } else if (activeSlotDoc.drawTime && !isRunningDraw) {
          const targetTime = activeSlotDoc.drawTime?.toDate ? activeSlotDoc.drawTime.toDate().getTime() : new Date(activeSlotDoc.drawTime).getTime();
          startServerSyncedCountdown(targetTime, participants, activeSlotDoc, shortSlotCode);
        }
      });
    }

    function resetDisplayToDefault(msg) {
      if (isRunningDraw) return;
      slotBadge.innerHTML = `<i class="fa-solid fa-clock"></i> ড্রয়ের অপেক্ষা`;
      timerDisplay.innerText = "00:00";
      spinnerContainer.innerHTML = `<div class="spinner-item">---</div>`;
      winnerStatusText.innerText = msg;
      currentActiveSlotId = null;
    }

    function startServerSyncedCountdown(targetTime, participants, slotData, shortSlotCode) {
      isRunningDraw = true;

      const countdownInterval = setInterval(async () => {
        const now = Date.now();
        const diff = targetTime - now;

        if (diff <= 0) {
          clearInterval(countdownInterval);
          await triggerServerSideDraw(shortSlotCode, slotData.id || currentActiveSlotId);
        } else {
          const seconds = Math.floor((diff % (1000 * 60)) / 1000);
          const minutes = Math.floor(diff / (1000 * 60));
          timerDisplay.innerText = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
          winnerStatusText.innerText = `স্লট #${shortSlotCode} কাউন্টডাউন চলছে...`;
          spinnerContainer.innerHTML = participants.map(p => `<div class="spinner-item">${escapeHtml(p.number)} — ${escapeHtml(p.name)}</div>`).join('');
        }
      }, 1000);
    }

    async function triggerServerSideDraw(shortSlotCode, slotId) {
      timerDisplay.innerText = "DRAWING...";
      winnerStatusText.innerText = `বিজয়ী নির্বাচন প্রক্রিয়া চলছে...`;

      try {
        const runDrawFunction = httpsCallable(functions, 'runLotteryDraw');
        const result = await runDrawFunction({ slotId: slotId });
        
        if (result.data && result.data.success) {
          playPodiumAnimation(result.data.winnersList, shortSlotCode);
        } else {
          winnerStatusText.innerText = `ড্র সম্পন্ন হয়েছে।`;
          isRunningDraw = false;
        }
      } catch (err) {
        console.error("Draw execution error:", err);
        winnerStatusText.innerText = `ড্র সম্পন্ন করতে সমস্যা হয়েছে।`;
        isRunningDraw = false;
      }
    }

    function showExistingWinners(winnersList, shortSlotCode) {
      timerDisplay.innerText = "সম্পন্ন";
      if (winnersList.length > 0) {
        winnerStatusText.innerText = `স্লট #${shortSlotCode} এর ড্র সম্পন্ন হয়েছে`;
        
        let podiumHtml = '';
        winnersList.forEach((w, idx) => {
          let rankClass = idx === 0 ? 'podium-1' : (idx === 1 ? 'podium-2' : 'podium-3');
          let medalIcon = idx === 0 ? 'fa-trophy' : (idx === 1 ? 'fa-medal' : 'fa-award');
          podiumHtml += `
            <div class="podium-item ${rankClass}" style="animation-delay: ${idx * 0.2}s;">
              <span><i class="fa-solid ${medalIcon}"></i> ${escapeHtml(w.rank || (idx+1+'ম'))}</span>
              <span>${escapeHtml(w.number)}</span>
              <span>${escapeHtml(w.name)}</span>
            </div>
          `;
        });
        spinnerContainer.innerHTML = podiumHtml;
      } else {
        winnerStatusText.innerText = `স্লট #${shortSlotCode} এর ড্র সম্পন্ন হয়েছে`;
      }
      isRunningDraw = false;
      loadUserHistory();
    }

    function playPodiumAnimation(winnersList, shortSlotCode) {
      timerDisplay.innerText = "সম্পন্ন";
      winnerStatusText.innerText = `স্লট #${shortSlotCode} এর ড্র সফলভাবে সম্পন্ন হয়েছে!`;
      playSound();

      let podiumHtml = '';
      winnersList.forEach((w, idx) => {
        let rankClass = idx === 0 ? 'podium-1' : (idx === 1 ? 'podium-2' : 'podium-3');
        let medalIcon = idx === 0 ? 'fa-trophy' : (idx === 1 ? 'fa-medal' : 'fa-award');
        podiumHtml += `
          <div class="podium-item ${rankClass}" style="animation-delay: ${idx * 0.3}s;">
            <span><i class="fa-solid ${medalIcon}"></i> ${escapeHtml(w.rank || (idx+1+'ম'))}</span>
            <span>${escapeHtml(w.number)}</span>
            <span>${escapeHtml(w.name)}</span>
          </div>
        `;
      });
      
      spinnerContainer.innerHTML = podiumHtml;

      const topWinner = winnersList[0] || {};
      congratsText.innerHTML = `স্লট ID: <b>#${shortSlotCode}</b><br>১ম বিজয়ী: <b>${escapeHtml(topWinner.name || 'N/A')}</b><br>টিকিট: <b>${escapeHtml(topWinner.number || 'N/A')}</b><br>পুরস্কার বিজয়ীগণ তালিকাভুক্ত!`;
      congratsBanner.classList.add('active');

      setTimeout(() => {
        congratsBanner.classList.remove('active');
        isRunningDraw = false;
        loadUserHistory();
      }, 4500);
    }

    const chatInput = document.getElementById('chatInput');
    document.getElementById('sendChatBtn').addEventListener('click', async () => {
      const msg = chatInput.value.trim();
      if (!msg || !auth.currentUser) return;

      try {
        const userDoc = await getDoc(doc(db, "users", auth.currentUser.uid));
        const userData = userDoc.exists() ? userDoc.data() : {};

        await addDoc(collection(db, "live_chats"), {
          name: userData.name || 'ইউজার',
          photo: userData.photoUrl || 'https://cdn-icons-png.flaticon.com/512/149/149071.png',
          message: msg,
          createdAt: serverTimestamp()
        });
        chatInput.value = '';
      } catch (e) {
        console.error("Chat send error", e);
      }
    });

    onSnapshot(query(collection(db, "live_chats"), orderBy("createdAt", "asc")), (snap) => {
      let html = '';
      snap.forEach(d => {
        let c = d.data();
        html += `<div class="chat-bubble"><img src="${escapeHtml(c.photo || '')}" class="chat-avatar"><div class="chat-content-box"><div class="chat-username">${escapeHtml(c.name || '')}</div><div class="chat-text">${escapeHtml(c.message || '')}</div></div></div>`;
      });
      const container = document.getElementById('chatMessagesContainer');
      container.innerHTML = html;
      container.scrollTop = container.scrollHeight;
    });

    window.onload = listenForLiveSlots;
  </script>
</body>
</html>
