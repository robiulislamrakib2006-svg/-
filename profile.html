<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>প্রোফাইল সেটিংস - কোপা সামসু লটারি</title>

  <!-- Google Fonts & Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root {
      --bg-color: #090a0f;
      --card-bg: rgba(18, 22, 36, 0.95);
      --gold: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffd700 0%, #ff8c00 100%);
      --accent-green: #00e676;
      --text-muted: #a0aec0;
      --border-color: rgba(255, 215, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-color);
      min-height: 100vh;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 14px 14px 40px 14px;
      overflow-x: hidden;
    }

    .main-wrapper {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* টপ হেডার */
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 14px 18px;
    }

    .back-btn {
      color: var(--gold);
      text-decoration: none;
      font-size: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .page-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
    }

    /* কার্ড ডিজাইন */
    .card {
      background: var(--card-bg);
      backdrop-filter: blur(15px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    /* প্রোফাইল পিকচার সেকশন */
    .profile-pic-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 20px;
    }

    .current-avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--gold);
      object-fit: cover;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      margin-bottom: 10px;
      background: #1a202c;
    }

    .avatar-select-label {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 10px;
      font-weight: 600;
      text-align: center;
    }

    /* ১০টি SVG সিলেকশন গ্রিড */
    .svg-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 15px;
    }

    .svg-option {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.1);
      cursor: pointer;
      overflow: hidden;
      transition: all 0.2s;
      background: #1a202c;
      padding: 2px;
    }

    .svg-option img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .svg-option.selected {
      border-color: var(--gold);
      transform: scale(1.1);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
    }

    /* ফর্ম ইনপুট ফিল্ড */
    .form-group {
      margin-bottom: 14px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .input-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 12px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-box:focus {
      border-color: var(--gold);
    }

    .section-divider {
      margin: 20px 0;
      border: 0;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
    }

    .section-heading {
      font-size: 14px;
      font-weight: 700;
      color: var(--gold);
      margin-bottom: 12px;
    }

    /* বাটন স্টাইল */
    .btn-submit {
      width: 100%;
      background: var(--gold-gradient);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
      transition: opacity 0.2s;
      margin-top: 10px;
    }

    .btn-submit:active {
      opacity: 0.85;
    }

    .btn-logout {
      width: 100%;
      background: rgba(255, 77, 77, 0.15);
      color: #ff4d4d;
      border: 1px solid rgba(255, 77, 77, 0.4);
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: background 0.2s;
      margin-top: 12px;
    }

    .btn-logout:hover {
      background: rgba(255, 77, 77, 0.25);
    }
  </style>
</head>
<body>

  <div class="main-wrapper">

    <!-- টপ বার -->
    <div class="top-bar">
      <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> ড্যাশবোর্ড</a>
      <div class="page-title">প্রোফাইল সেটিংস</div>
      <div style="width: 60px;"></div>
    </div>

    <!-- প্রোফাইল আপডেট কার্ড -->
    <div class="card">
      <form id="profileForm">
        
        <!-- প্রোফাইল ছবি ও ১০টি SVG সিলেকশন -->
        <div class="profile-pic-container">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Current Avatar" class="current-avatar" id="selectedAvatarPreview">
          <div class="avatar-select-label">নিচের যেকোনো একটি অবতার সিলেক্ট করুন:</div>
          
          <!-- ১০টি আলাদা SVG অবতার লিস্ট -->
          <div class="svg-grid" id="svgGrid">
            <div class="svg-option selected" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" alt="Avatar 1">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Aneka" alt="Avatar 2">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Zack">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Zack" alt="Avatar 3">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Mimi">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Mimi" alt="Avatar 4">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Leo">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Leo" alt="Avatar 5">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Sasha">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sasha" alt="Avatar 6">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Oliver">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Oliver" alt="Avatar 7">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Chloe">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Chloe" alt="Avatar 8">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Sam">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Sam" alt="Avatar 9">
            </div>
            <div class="svg-option" data-url="https://api.dicebear.com/7.x/avataaars/svg?seed=Lily">
              <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Lily" alt="Avatar 10">
            </div>
          </div>
        </div>

        <!-- ব্যক্তিগত তথ্য -->
        <div class="form-group">
          <label class="form-label">আপনার নাম</label>
          <input type="text" id="nameInput" class="input-box" placeholder="নাম লিখুন" required>
        </div>

        <div class="form-group">
          <label class="form-label">ফোন নম্বর</label>
          <input type="text" id="phoneInput" class="input-box" placeholder="ফোন নম্বর" required>
        </div>

        <hr class="section-divider">
        <div class="section-heading"><i class="fa-solid fa-lock"></i> পাসওয়ার্ড পরিবর্তন (ঐচ্ছিক)</div>

        <div class="form-group">
          <label class="form-label">পুরানো পাসওয়ার্ড</label>
          <input type="password" id="oldPassword" class="input-box" placeholder="বর্তমান পাসওয়ার্ড দিন">
        </div>

        <div class="form-group">
          <label class="form-label">নতুন পাসওয়ার্ড</label>
          <input type="password" id="newPassword" class="input-box" placeholder="নতুন পাসওয়ার্ড দিন">
        </div>

        <div class="form-group">
          <label class="form-label">কনফার্ম নতুন পাসওয়ার্ড</label>
          <input type="password" id="confirmPassword" class="input-box" placeholder="পুনরায় নতুন পাসওয়ার্ড দিন">
        </div>

        <button type="submit" class="btn-submit">প্রোফাইল আপডেট করুন</button>
      </form>

      <!-- লগআউট বাটন -->
      <button type="button" id="logoutBtn" class="btn-logout">
        <i class="fa-solid fa-right-from-bracket"></i> অ্যাকাউন্ট থেকে লগআউট করুন
      </button>

    </div>

  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      onAuthStateChanged, 
      signOut, 
      EmailAuthProvider, 
      reauthenticateWithCredential, 
      updatePassword 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      updateDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuSbFLx4xcesLprgZhb9T5H3Pl5oxVq94",
      authDomain: "kopa-samsu-95941.firebaseapp.com",
      projectId: "kopa-samsu-95941",
      storageBucket: "kopa-samsu-95941.firebasestorage.app",
      messagingSenderId: "949740806870",
      appId: "1:949740806870:web:52e745bba2436172481f77"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let selectedAvatarUrl = "https://api.dicebear.com/7.x/avataaars/svg?seed=Felix";

    // SVG সিলেকশন হ্যান্ডলার
    const svgOptions = document.querySelectorAll('.svg-option');
    svgOptions.forEach(option => {
      option.addEventListener('click', () => {
        svgOptions.forEach(opt => opt.classList.remove('selected'));
        option.classList.add('selected');
        selectedAvatarUrl = option.getAttribute('data-url');
        document.getElementById('selectedAvatarPreview').src = selectedAvatarUrl;
      });
    });

    // ইউজার ডাটা লোড করা
    onAuthStateChanged(auth, async (user) => {
      if (user) {
        const docRef = doc(db, "users", user.uid);
        const docSnap = await getDoc(docRef);
        if (docSnap.exists()) {
          const data = docSnap.data();
          document.getElementById('nameInput').value = data.name || '';
          document.getElementById('phoneInput').value = data.phone || user.phoneNumber || '';
          if (data.profilePic) {
            selectedAvatarUrl = data.profilePic;
            document.getElementById('selectedAvatarPreview').src = selectedAvatarUrl;
            
            // কারেক্ট অপশন সিলেক্ট করা গ্রিডে
            svgOptions.forEach(opt => {
              if (opt.getAttribute('data-url') === selectedAvatarUrl) {
                svgOptions.forEach(o => o.classList.remove('selected'));
                opt.classList.add('selected');
              }
            });
          }
        }
      } else {
        window.location.href = "login.html";
      }
    });

    // ফর্ম সাবমিট (নাম, নম্বর, ছবি ও পাসওয়ার্ড পরিবর্তন)
    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = auth.currentUser;
      if (!user) return;

      const newName = document.getElementById('nameInput').value.trim();
      const newPhone = document.getElementById('phoneInput').value.trim();
      const oldPass = document.getElementById('oldPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      Swal.fire({
        title: 'আপডেট হচ্ছে...',
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading()
      });

      try {
      // ১. আগে password change লাগলে সেটি সম্পন্ন হবে
if (oldPass || newPass || confirmPass) {

  if (!oldPass || !newPass || !confirmPass) {
    throw new Error(
      "পাসওয়ার্ড পরিবর্তনের জন্য পুরানো, নতুন এবং কনফার্ম পাসওয়ার্ড সবগুলো পূরণ করুন!"
    );
  }

  if (newPass !== confirmPass) {
    throw new Error(
      "নতুন পাসওয়ার্ড এবং কনফার্ম পাসওয়ার্ড মিলছে না!"
    );
  }

  if (newPass.length < 6) {
    throw new Error(
      "নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে!"
    );
  }

  if (!user.email) {
    throw new Error(
      "এই অ্যাকাউন্টে ইমেইল পাওয়া যায়নি। পাসওয়ার্ড পরিবর্তন করা যাচ্ছে না।"
    );
  }

  const credential = EmailAuthProvider.credential(
    user.email,
    oldPass
  );

  await reauthenticateWithCredential(
    user,
    credential
  );

  await updatePassword(
    user,
    newPass
  );
}

// ২. Password সফল হলে profile data save হবে
await updateDoc(
  doc(db, "users", user.uid),
  {
    name: newName,
    phone: newPhone,
    profilePic: selectedAvatarUrl
  }
);
        Swal.fire({
          icon: 'success',
          title: 'সফল!',
          text: 'প্রোফাইল সফলভাবে আপডেট করা হয়েছে।',
          confirmButtonColor: '#ffd700'
        }).then(() => {
          location.reload();
        });

      } catch (error) {
        Swal.fire({
          icon: 'error',
          title: 'ত্রুটি!',
          text: error.message || 'কিছু ভুল হয়েছে, আবার চেষ্টা করুন।',
          confirmButtonColor: '#ff4d4d'
        });
      }
    });

    // লগআউট হ্যান্ডলার
    document.getElementById('logoutBtn').addEventListener('click', async () => {
      const result = await Swal.fire({
        title: 'লগআউট করতে চান?',
        text: "আপনি কি আপনার অ্যাকাউন্ট থেকে বের হয়ে যেতে চান?",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ff4d4d',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'হ্যাঁ, লগআউট',
        cancelButtonText: 'বাতিল'
      });

      if (result.isConfirmed) {
        try {
          await signOut(auth);
          window.location.href = "login.html";
        } catch (error) {
          Swal.fire('ত্রুটি!', 'লগআউট করতে সমস্যা হয়েছে।', 'error');
        }
      }
    });
  </script>
</body>
</html>
